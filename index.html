ating insulation quality—low values indicate insulation breakdown** Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","C":"The current flow","D":"The voltage available","E":"The frequency"},"answer":"B","answer_text":"A high resistance value (typically in megohms) between conductors and ground, indicating insulation quality—low values indicate insulation breakdown","rationale":"Megohmmeter (insulation resistance) tests apply high DC voltage and measure resulting current. High resistance (good insulation) typically shows as millions of ohms (megohms). Low resistance (poor insulation) indicates moisture, contamination, or damage. LADWP uses megohm testing for motors, transformers, and cables during commissioning and maintenance."},{"id":180,"question":"What is the meaning of \"instantaneous trip\" for circuit breakers?","options":{"A":"Instant death**","B":"Immediate opening (within a few milliseconds) when current exceeds the instantaneous threshold, protecting against severe short circuits**","C":"A slow opening","D":"Preventing tripping","E":"A type of circuit"},"answer":"B","answer_text":"Immediate opening (within a few milliseconds) when current exceeds the instantaneous threshold, protecting against severe short circuits","rationale":"Instantaneous trip settings allow breakers to open almost immediately (1-5 milliseconds) when current exceeds a threshold (typically 5-10 times nominal current), protecting against severe short circuits. Slower thermal and short-delay curves allow loading to be accommodated. LADWP breaker settings include properly coordinated instantaneous trip functions. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":181,"question":"Which statement correctly distinguishes a grounded/grounding source from a neutral conductor?","options":{"A":"They are different utility companies","B":"The neutral is a circuit conductor intended to carry normal current; equipment grounding conductors are intended for fault-current paths and normally do not carry load current","C":"They are simply different voltage levels","D":"They are different frequencies","E":"They are different climates"},"answer":"B","answer_text":"The neutral is a circuit conductor intended to carry normal current; equipment grounding conductors are intended for fault-current paths and normally do not carry load current","rationale":"The original 'ground-source versus neutral-source system' wording is not standard terminology. In a typical grounded system, the neutral is a grounded circuit conductor that can carry normal load current, while the equipment grounding conductor is intended to carry fault current."},{"id":182,"question":"What is the purpose of \"cable shielding\" on medium and high-voltage cables?","options":{"A":"To protect cables from weather","B":"To contain the electric field around energized conductors, preventing stray voltage and electrical interference, and improving field distribution","C":"To reduce current","D":"To increase voltage","E":"To prevent physical damage Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"To contain the electric field around energized conductors, preventing stray voltage and electrical interference, and improving field distribution","rationale":"Metallic shields around cable insulation contain electric field, ensuring field stress is controlled and prevents surface discharge. Shields must be properly grounded at both ends. Shielded cable costs more but is essential for medium and high-voltage applications where unshielded cable would produce excessive surface gradient. LADWP high-voltage cables use proper shielding."},{"id":183,"question":"What does \"phasing out\" lines mean in electrical work?","options":{"A":"Connecting circuits in phases","B":"Determining which phase (A, B, C) each conductor belongs to in a three-phase system, essential before making connections to prevent phase sequence problems","C":"Removing equipment","D":"Testing circuits","E":"Measuring frequency"},"answer":"B","answer_text":"Determining which phase (A, B, C) each conductor belongs to in a three-phase system, essential before making connections to prevent phase sequence problems","rationale":"Incorrect phasing (connecting loads to wrong phases) can cause equipment damage and system problems. Phase sequence matters because motors have specific rotational direction requirements, and loads must be balanced. LADWP connections are verified for correct phasing during commissioning and whenever changes are made."},{"id":184,"question":"What is a \"polyphase meter\" and why is it important? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"A meter that measures multiple voltages","B":"A meter that measures voltage, current, and power on three-phase circuits, essential for billing and monitoring three-phase customers","C":"A meter for different locations","D":"A tool for phase checking","E":"A voltage tester"},"answer":"B","answer_text":"A meter that measures voltage, current, and power on three-phase circuits, essential for billing and monitoring three-phase customers","rationale":"Three-phase customers require three-phase meters that simultaneously measure all three phases. These meters record total energy consumption, power factor, and other parameters. Proper meter installation and accuracy is critical for customer billing. LADWP three-phase customers have polyphase meters installed."},{"id":185,"question":"What is the purpose of a \"primary disconnect\" on a transformer?","options":{"A":"To disconnect the secondary","B":"To isolate the transformer primary from the utility line for maintenance and safety, allowing the transformer to be de-energized and locked out**","C":"To regulate voltage","D":"To protect against overload","E":"To measure voltage"},"answer":"B","answer_text":"To isolate the transformer primary from the utility line for maintenance and safety, allowing the transformer to be de-energized and locked out Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Primary disconnects (on the utility side) allow technicians to de- energize transformers for maintenance. Every transformer must have an accessible primary disconnect. This is essential safety equipment. LADWP requires primary disconnects on all customer-owned transformers served by LADWP."},{"id":186,"question":"What is a \"secondary disconnect\" on a transformer?","options":{"A":"A disconnect for backup power","B":"Isolates the transformer secondary from customer loads, allowing safe maintenance and lockout of the transformer output side**","C":"A main service disconnect","D":"A utility-side switch","E":"A safety light"},"answer":"B","answer_text":"Isolates the transformer secondary from customer loads, allowing safe maintenance and lockout of the transformer output side","rationale":"Secondary disconnects on transformer secondary windings allow safe de-energization of output circuits. This is essential if service entrance or sub-panel work is needed. Secondary disconnects are typically the main service panel breaker. Both primary and secondary disconnects must be accessible."},{"id":187,"question":"What is \"neutral current imbalance\" in three-phase systems?","options":{"A":"Unequal phase currents**","B":"Excessive current in the neutral conductor indicating unbalanced single-phase loads across the three phases, creating heating and voltage regulation problems**","C":"Total system current","D":"Voltage imbalance Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"Low frequency"},"answer":"B","answer_text":"Excessive current in the neutral conductor indicating unbalanced single-phase loads across the three phases, creating heating and voltage regulation problems","rationale":"When single-phase loads are unequally distributed among three phases, the neutral carries return current. Heavy neutral current indicates unbalance that increases losses and heating. Ideal three-phase systems have balanced loads minimizing neutral current. LADWP monitors neutral current as an indicator of load imbalance."},{"id":188,"question":"What is the purpose of \"switchboard\" in electrical systems?","options":{"A":"A notice board","B":"A large panel housing multiple switches, protective devices, and buses for coordinating and controlling power distribution in buildings and substations**","C":"A type of circuit breaker","D":"A communication device","E":"A measuring instrument"},"answer":"B","answer_text":"A large panel housing multiple switches, protective devices, and buses for coordinating and controlling power distribution in buildings and substations","rationale":"Switchboards mount and coordinate main protective devices, disconnects, and buses for distributed power. They are larger than panelboards and house equipment rated for higher currents. Switchboards are the nerve center of facility electrical systems. LADWP uses switchboards in substations and large customer facilities."},{"id":189,"question":"Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) What is an \"underground distribution vault\" and what equipment does it contain?","options":{"A":"A storage room","B":"An underground chamber housing transformers, switches, cables, and splicing materials for underground distribution systems, protected from weather and accessible for maintenance**","C":"A cable storage area","D":"A transformer cooling chamber","E":"A testing facility"},"answer":"B","answer_text":"An underground chamber housing transformers, switches, cables, and splicing materials for underground distribution systems, protected from weather and accessible for maintenance","rationale":"Distribution vaults provide protected access to underground cables and equipment. They must be properly ventilated, drained, and maintained to prevent flooding and corrosion. LADWP underground systems include vaults at cable splices and equipment locations. Safety procedures for vault entry include confined space requirements."},{"id":190,"question":"What is the purpose of \"expulsion fuses\" in power systems?","options":{"A":"To remove people","B":"High-voltage fuses that forcefully expel hot gases and arc products when they melt, extinguishing the arc and interrupting the current safely**","C":"To measure current","D":"To regulate voltage","E":"To store energy Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"High-voltage fuses that forcefully expel hot gases and arc products when they melt, extinguishing the arc and interrupting the current safely","rationale":"Expulsion fuses on distribution poles use the arc's own energy to blow out the arc by forcefully ejecting hot gas and melted metal. This violent but effective action interrupts the fault current. These fuses are used on many LADWP distribution circuits. After operation, fuses must be replaced."},{"id":191,"question":"What is the meaning of \"sectionalizing fuse\" in distribution systems?","options":{"A":"A fuse that divides circuits into sections","B":"A fuse with time-delay characteristics that allows branch line fuses to clear minor faults before the main line fuse blows, providing selective isolation**","C":"A safety device","D":"A protective relay","E":"A measurement tool"},"answer":"B","answer_text":"A fuse with time-delay characteristics that allows branch line fuses to clear minor faults before the main line fuse blows, providing selective isolation","rationale":"Sectionalizing fuses have time-delay characteristics so that smaller branch line fuses can blow first during minor branch faults, avoiding unnecessary outages of the main line. This coordination principle applies to all protective devices. LADWP uses sectionalizing fuses on distribution systems for this coordination."},{"id":192,"question":"What is a \"cable pulling sock\" or \"cable sleeve\" used for?","options":{"A":"Keeping cables warm Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"Protective sheath wrapped around bundles of cables during pulling to prevent abrasion and insulation damage, also aids in pulling large cable groups**","C":"Organizing cables","D":"Preventing moisture","E":"Improving conductivity"},"answer":"B","answer_text":"Protective sheath wrapped around bundles of cables during pulling to prevent abrasion and insulation damage, also aids in pulling large cable groups","rationale":"Cable socks are mesh sleeves that slip over cable bundles during pulling. They distribute pulling force evenly and protect cable insulation from abrasion against conduit edges. They are especially useful when pulling multiple cables simultaneously. LADWP uses cable socks for large cable installations."},{"id":193,"question":"What is the purpose of \"load profiling\" in customer analysis?","options":{"A":"Creating customer records","B":"Recording how customer load varies over time, enabling better system planning, demand response programs, and identifying unusual consumption patterns**","C":"Measuring peak demand","D":"Determining electricity rates","E":"Auditing customers"},"answer":"B","answer_text":"Recording how customer load varies over time, enabling better system planning, demand response programs, and identifying unusual consumption patterns","rationale":"Smart meters provide detailed load profile data showing how each customer's usage varies hourly, daily, and seasonally. This data helps LADWP plan system improvements, identify theft or problems, and develop targeted demand response programs. Load profiling is key to modern utility management. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":194,"question":"What is the meaning of \"reactive load\" in AC circuits?","options":{"A":"A load that responds to stimuli","B":"Inductors and capacitors that store and release energy without consuming real power, creating reactive current that lags or leads voltage**","C":"Any load","D":"A resistive load","E":"An emergency load"},"answer":"B","answer_text":"Inductors and capacitors that store and release energy without consuming real power, creating reactive current that lags or leads voltage","rationale":"Reactive loads (motors, transformers, inductors) draw reactive current that doesn't produce real work but increases system losses. Motors draw lagging reactive power; capacitors draw leading reactive power. Reactive power is measured in VARS (volt-ampere reactive). LADWP charges industrial customers with high reactive demand."},{"id":195,"question":"What is a \"demand response\" program offered by electrical utilities?","options":{"A":"Fast customer service**","B":"Programs that incentivize customers to reduce usage during peak periods or system emergencies, lowering peak demand and improving system stability","C":"Emergency power supply","D":"Faster billing**","E":"Service improvement** Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"Programs that incentivize customers to reduce usage during peak periods or system emergencies, lowering peak demand and improving system stability","rationale":"Demand response pays customers (especially large industrial users) to reduce consumption when the utility signals a need. This reduces peak demand without building new generation capacity. Examples include reducing air conditioning load, water heater heating, or industrial processes. LADWP offers demand response programs."},{"id":196,"question":"What is the purpose of \"power system stability\" analysis?","options":{"A":"Ensuring equipment doesn't tip over","B":"Analyzing whether the system can maintain synchronism when subjected to disturbances like sudden load changes or line outages, preventing cascading blackouts**","C":"Measuring steady voltage","D":"Checking building structure","E":"Testing equipment**"},"answer":"B","answer_text":"Analyzing whether the system can maintain synchronism when subjected to disturbances like sudden load changes or line outages, preventing cascading blackouts","rationale":"Power system stability is critical for reliable service. If generators lose synchronism following a disturbance, cascading failures can lead to widespread blackouts. Stability studies analyze whether systems can recover from various disturbances. LADWP conducts stability studies to ensure system resilience."},{"id":197,"question":"What is the function of \"synchronous condensers\" in power systems? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"Cooling devices","B":"Synchronous motors running without load that provide reactive power and voltage support to the system, improving stability and power factor**","C":"Power storage","D":"Measurement devices","E":"Protection equipment"},"answer":"B","answer_text":"Synchronous motors running without load that provide reactive power and voltage support to the system, improving stability and power factor","rationale":"Synchronous condensers are large synchronous motors spinning without mechanical load. They draw reactive current that can be controlled to support voltage and stability. As utilities retire traditional generators, synchronous condensers are being reinstalled to provide stability support. LADWP considers these for future system resilience."},{"id":198,"question":"What is the purpose of \"battery energy storage systems\" (BESS) in modern grids?","options":{"A":"To provide backup for homes only","B":"To store renewable energy and provide it during peak demand, voltage support, and frequency stability, improving grid resilience and reducing need for peaking power plants**","C":"Emergency power only","D":"Measuring devices","E":"Cooling systems"},"answer":"B","answer_text":"To store renewable energy and provide it during peak demand, voltage support, and frequency stability, improving grid resilience and reducing need for peaking power plants Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"BESS stores energy from renewable sources (solar, wind) when available and releases it when needed. This enables higher renewable penetration and reduces need for fossil fuel peaking plants. LADWP is deploying BESS systems to support its renewable energy goals and grid stability."},{"id":199,"question":"What is the meaning of \"smart grid\" technology in utilities?","options":{"A":"A grid that thinks","B":"Electrical systems with communications, sensors, and controls enabling two-way communication, automated demand response, and real-time load balancing for improved efÏciency and reliability**","C":"Digital billing**","D":"Automatic meter reading**","E":"Internet connectivity**"},"answer":"B","answer_text":"Electrical systems with communications, sensors, and controls enabling two-way communication, automated demand response, and real-time load balancing for improved efÏciency and reliability","rationale":"Smart grid involves deploying sensors, communications networks, and automated controls throughout the system. This enables real-time monitoring, automated demand response, rapid fault detection, and improved efÏciency. LADWP is implementing smart grid technologies to modernize its infrastructure."},{"id":200,"question":"What is the primary responsibility of an electrical craft helper at LADWP?","options":{"A":"To operate large equipment independently","B":"To assist licensed electricians with installation, maintenance, and repair of electrical systems while learning the trade and following all safety procedures Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","C":"To manage electrical systems","D":"To design electrical circuits","E":"To train other workers"},"answer":"B","answer_text":"To assist licensed electricians with installation, maintenance, and repair of electrical systems while learning the trade and following all safety procedures","rationale":"Electrical craft helpers work under the supervision of licensed electricians. Their role is to assist with hands-on work, learn proper techniques and safety practices, follow all procedures, and gain experience toward becoming a licensed electrician. Success as a craft helper requires dedication to safety, quality workmanship, and continuous learning. This is the foundation for a rewarding career at LADWP."},{"id":201,"question":"What is a service-level agreement (SLA)?","options":{"A":"An informal understanding with no defined expectations","B":"An agreement or documented set of service expectations that can define performance measures, response times, responsibilities, and related commitments","C":"A billing arrangement only","D":"A rate structure document only","E":"A complaint procedure only"},"answer":"B","answer_text":"An agreement or documented set of service expectations that can define performance measures, response times, responsibilities, and related commitments","rationale":"An SLA is generally an agreement or documented set of service expectations. It should not automatically be described as a formal LADWP contract that guarantees compensation if a commitment is missed."},{"id":202,"question":"What is the purpose of \"underground service locates\" before excavation?","options":{"A":"To map property boundaries","B":"To identify the precise location of buried electrical cables, gas lines, water pipes, and other utilities before digging, preventing accidents and service interruptions","C":"To test soil conditions","D":"To assess property value","E":"To plan landscaping"},"answer":"B","answer_text":"To identify the precise location of buried electrical cables, gas lines, water pipes, and other utilities before digging, preventing accidents and service interruptions","rationale":"Before any excavation, all underground utilities must be located and marked. LADWP provides locate marking in its service territory at no charge. Hitting electrical cables causes electrocution hazards, equipment damage, and service outages. California law requires utility locates before digging. LADWP requires locates 48 hours in advance."},{"id":203,"question":"What is the function of an \"overhead service entrance\"?","options":{"A":"Providing shade above the meter","B":"Bringing electrical power from utility lines to a customer's building via overhead cables, with the service point, meter, and disconnect visible for easy access and maintenance","C":"Aesthetic appearance Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","D":"Weather protection","E":"Antenna mounting"},"answer":"B","answer_text":"Bringing electrical power from utility lines to a customer's building via overhead cables, with the service point, meter, and disconnect visible for easy access and maintenance","rationale":"Overhead service is the most economical for small to medium loads, with visible conductors and readily accessible equipment. Service points must be inspected regularly and clearly marked. LADWP operates most residential and small commercial customers through overhead service. Equipment must be properly grounded and protected from weather damage."},{"id":204,"question":"What is the danger of \"bootleg grounds\" or \"false grounds\"?","options":{"A":"They are fake and don't work","B":"Connections to water pipes, gas lines, or other non-grounding conductors that do not provide safe ground paths and may not carry fault current safely, creating shock hazards","C":"They are only used in emergencies","D":"They improve grounding","E":"They are permitted in some cases"},"answer":"B","answer_text":"Connections to water pipes, gas lines, or other non- grounding conductors that do not provide safe ground paths and may not carry fault current safely, creating shock hazards","rationale":"Only proper grounding electrodes (ground rods, driven pipes, concrete-encased conductors) provide reliable grounds. Water pipes and gas lines are not reliable grounds. Bootleg grounds can fail in emergencies when fault current most needs a safe path. NEC prohibits bootleg grounds. LADWP verifies proper grounding on all installations. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":205,"question":"What is the purpose of \"construction power\" temporary installations?","options":{"A":"Power for building construction activities","B":"Temporary electrical service for construction equipment and tools during building construction or maintenance projects, properly protected and safely installed for the duration of work","C":"Permanent installation**","D":"Testing equipment","E":"Emergency lighting"},"answer":"B","answer_text":"Temporary electrical service for construction equipment and tools during building construction or maintenance projects, properly protected and safely installed for the duration of work","rationale":"Construction power provides temporary service with proper disconnects, breakers, and GFCI protection for job site use. It must be removed when construction completes. Temporary power requires proper sizing, adequate protection, and regular inspection. LADWP issues temporary service permits with specific requirements and expiration dates."},{"id":206,"question":"What is a \"temporary service pole\" used for?","options":{"A":"A pole for temporary flagging","B":"A pole-mounted temporary service entrance providing power to construction sites or emergency operations, with meter, disconnect, and breaker mounted on pole for easy connection of temporary circuits","C":"A communications antenna","D":"A lighting fixture Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"A cable support"},"answer":"B","answer_text":"A pole-mounted temporary service entrance providing power to construction sites or emergency operations, with meter, disconnect, and breaker mounted on pole for easy connection of temporary circuits","rationale":"Temporary service poles provide economical temporary power without building modifications. They include meter, main disconnect, and branch breakers for multiple loads. After project completion, the pole is removed and the location restored. LADWP provides temporary service poles for construction projects, emergency relief, and special events."},{"id":207,"question":"What is the proper procedure when discovering someone in electrical shock?","options":{"A":"Touch them to pull them away","B":"Turn off power immediately (if safe); if unable, use insulating tools or materials to separate the victim from the source before starting CPR and calling emergency services","C":"Wait for someone else to help","D":"Leave the area","E":"Call for help only"},"answer":"B","answer_text":"Turn off power immediately (if safe); if unable, use insulating tools or materials to separate the victim from the source before starting CPR and calling emergency services","rationale":"Victims in contact with electrical conductors must be separated from the source before safe contact is possible. Use non-conductive materials (wood pole, rubber baton) to break contact. Begin CPR immediately after separation. Call emergency services. LADWP workers are trained in electrical shock rescue procedures and CPR. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":208,"question":"What is the meaning of \"single-pole operation\" or \"single-pole disconnect\" on three-phase circuits?","options":{"A":"Using one phase only","B":"A disconnect that breaks only one phase conductor while leaving others energized, which is unsafe and prohibited for most equipment disconnection","C":"Three-phase operation","D":"A testing method","E":"Reduced voltage operation"},"answer":"B","answer_text":"A disconnect that breaks only one phase conductor while leaving others energized, which is unsafe and prohibited for most equipment disconnection","rationale":"Three-phase equipment must be completely de-energized by disconnecting all three phases simultaneously. Single-pole disconnects leave the other two phases energized, creating shock hazards. Only multi-pole (simultaneous three-phase) disconnects are safe. NEC requires simultaneous phase disconnection. LADWP disconnects are all multi-pole for three-phase circuits."},{"id":209,"question":"What is the function of a \"power factor correction capacitor\" bank?","options":{"A":"To increase power","B":"To supply reactive power offsetting inductive loads, improving power factor and reducing reactive power charges and losses","C":"To increase voltage","D":"To reduce frequency","E":"To measure power factor Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"To supply reactive power offsetting inductive loads, improving power factor and reducing reactive power charges and avoided reactive power charges and losses","rationale":"Industrial facilities with motors and transformers draw significant reactive power, reducing overall power factor. Capacitor banks inject leading reactive power, offsetting inductive loads and improving power factor toward 1.0. Better power factor reduces system losses and avoids utility penalties. LADWP charges high reactive demand; capacitor banks save money for customers."},{"id":210,"question":"What is a \"line reactor\" and its purpose?","options":{"A":"A reactive line of defense","B":"An inductor series with power sources that limits fault current, reduces voltage spikes, and protects sensitive equipment from transient surges**","C":"A circuit breaker","D":"A transformer winding","E":"A grounding device"},"answer":"B","answer_text":"An inductor series with power sources that limits fault current, reduces voltage spikes, and protects sensitive equipment from transient surges","rationale":"Line reactors (series inductors) in power distribution limit fault current by adding impedance to the circuit. This protects switchgear from excessive fault current damage and reduces voltage transients from fast-changing loads. They are essential with large VFDs or when large generators/UPS systems are added. LADWP uses line reactors where needed for system protection."},{"id":211,"question":"What is the purpose of \"current limiting fuses\"? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"To measure current","B":"High-speed fuses that interrupt fault current in microseconds, preventing severe arc damage and reducing heat in switchgear during short circuits","C":"To regulate current","D":"To indicate current flow","E":"To store current"},"answer":"B","answer_text":"High-speed fuses that interrupt fault current in microseconds, preventing severe arc damage and reducing heat in switchgear during short circuits","rationale":"Current-limiting fuses operate so quickly (microseconds) that they interrupt fault current before it reaches its full peak value. This dramatically reduces arc damage to equipment and reduces stress on other protective devices. Current-limiting fuses are more expensive but provide superior protection in high- fault-current environments. LADWP uses current-limiting fuses in strategic locations."},{"id":212,"question":"What is a \"voltage divider\" in electrical circuits?","options":{"A":"A device that divides voltages**","B":"Series resistors that distribute voltage proportionally based on resistance values, used in measuring circuits and signal conditioning","C":"A transformer","D":"A circuit breaker","E":"A meter"},"answer":"B","answer_text":"Series resistors that distribute voltage proportionally based on resistance values, used in measuring circuits and signal conditioning Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Voltage dividers split source voltage into lower proportional voltages using series resistors. The voltage at intermediate points depends on resistance ratios. Voltage dividers are used in test equipment, analog-to-digital converters, and signal conditioning circuits. Understanding dividers is useful for troubleshooting and test equipment operation."},{"id":213,"question":"What is a \"current divider\" in electrical circuits?","options":{"A":"A device that divides current","B":"Parallel resistors or conductors that split current inversely proportional to resistance, with higher current through lower resistance paths","C":"A series circuit","D":"An open circuit","E":"A transformer"},"answer":"B","answer_text":"Parallel resistors or conductors that split current inversely proportional to resistance, with higher current through lower resistance paths","rationale":"In parallel circuits, current divides with more current through lower- resistance paths and less through higher-resistance paths. Current dividers are used in sensing circuits and current distribution. Understanding current division helps troubleshoot circuits where parallel paths exist."},{"id":214,"question":"What is the function of a \"snubber circuit\" in electrical systems?","options":{"A":"A rude response device","B":"Resistor-capacitor networks that dampen voltage spikes and oscillations from switching events, protecting sensitive equipment from transient damage Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","C":"A noise suppression device","D":"A filter","E":"A relay coil"},"answer":"B","answer_text":"Resistor-capacitor networks that dampen voltage spikes and oscillations from switching events, protecting sensitive equipment from transient damage","rationale":"Snubber circuits absorb energy from voltage spikes generated when inductive loads are switched or contacts open. Snubbers prevent relay coil damage, TTL circuit failures, and semiconductor destruction. They are especially important with power semiconductor switching. LADWP control circuits use snubbers where switching occurs."},{"id":215,"question":"What is the meaning of \"in-phase\" and \"out-of-phase\" in AC circuits?","options":{"A":"Different cycle times","B":"In-phase means voltage and current peaks occur simultaneously; out-of-phase means they peak at different times, affecting power factor and equipment operation","C":"Series circuits only","D":"Transformer primary and secondary","E":"Different frequencies"},"answer":"B","answer_text":"In-phase means voltage and current peaks occur simultaneously; out-of-phase means they peak at different times, affecting power factor and equipment operation","rationale":"Resistive loads have voltage and current in-phase (power factor = 1.0). Inductive loads cause current to lag voltage (lagging power factor); capacitive loads cause current to lead voltage (leading power factor). Phase angle between voltage Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) and current determines power factor and real versus reactive power. LADWP analyzes phase relationships for power factor corrections."},{"id":216,"question":"What is the purpose of \"cable ducts\" or \"cable troughs\"?","options":{"A":"To route water away from cables","B":"Shallow enclosed channels that guide and protect cables in buildings, allowing easy installation and future modifications while containing spills and providing organization","C":"Cable support systems","D":"Ventilation systems","E":"Drainage systems"},"answer":"B","answer_text":"Shallow enclosed channels that guide and protect cables in buildings, allowing easy installation and future modifications while containing spills and providing organization","rationale":"Cable ducts and troughs organize cables in commercial and industrial buildings, protecting them from physical damage while allowing future access and modifications. They are less expensive than conduit for protecting many cables. Ducts must not be overcrowded. LADWP underground customer installations sometimes use cable ducts."},{"id":217,"question":"What is a \"cable vault\" and its purpose?","options":{"A":"A large cable storage room","B":"An underground or above-ground chamber containing multiple power cables, providing access points and environmental protection while allowing cable cooling and inspection Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","C":"A transformer room","D":"A cable testing facility","E":"A pump station"},"answer":"B","answer_text":"An underground or above-ground chamber containing multiple power cables, providing access points and environmental protection while allowing cable cooling and inspection","rationale":"Cable vaults house and protect large power cables in urban areas where space is limited or cables must span long distances. Vaults provide cooling, moisture control, and access for splicing and maintenance. Safety procedures include confined space protocols for entry. LADWP operates cable vaults in downtown areas."},{"id":218,"question":"What is the purpose of \"cable fill calculations\" in cable trays?","options":{"A":"Determining tray weight","B":"Ensuring cables do not exceed maximum spacing and density to allow adequate cooling and prevent overheating of conductors in bundles","C":"Measuring cable length","D":"Calculating cost","E":"Predicting cable life"},"answer":"B","answer_text":"Ensuring cables do not exceed maximum spacing and density to allow adequate cooling and prevent overheating of conductors in bundles","rationale":"Cables in trays must not be packed too densely or the bundle cannot dissipate heat effectively. Spacing requirements depend on cable type and ambient temperature. NEMA standards provide fill guidelines. Exceeding fill causes overheating and insulation failure. LADWP tray installations follow all fill guidelines. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":219,"question":"What is an \"aerial cable\" or \"triplex cable\"?","options":{"A":"A cable with three conductors","B":"A twisted assembly of insulated conductors with a messenger wire for overhead installation without conduit, combining structural support and electrical conductors","C":"A three-phase cable","D":"Underground cable","E":"A three-layer insulation system"},"answer":"B","answer_text":"A twisted assembly of insulated conductors with a messenger wire for overhead installation without conduit, combining structural support and electrical conductors","rationale":"Aerial cables are economical for overhead residential service, combining all three conductors (two phases plus neutral, or one phase plus neutral plus ground) in a twisted bundle with a steel messenger wire for structural support. The messenger carries all mechanical load. LADWP uses triplex and multiplex aerial cable for overhead distribution and service."},{"id":220,"question":"What is the purpose of \"secondary service laterals\" in distribution systems?","options":{"A":"Side service lines","B":"Underground cables running from transformer to customer buildings, delivering secondary voltage (120/240V or 208/120V) and serving as the final connection point for customer service","C":"Overhead cables","D":"Transmission lines","E":"Grounding connections Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"Underground cables running from transformer to customer buildings, delivering secondary voltage (120/240V or 208/120V) and serving as the final connection point for customer service","rationale":"Secondary laterals (also called secondary service lines or service cables) connect distribution transformers to customer service entrances. These are low-voltage cables (typically 120/240V) in conduit or as aerial cables. LADWP installs and maintains secondary laterals as part of its distribution system responsibility."},{"id":221,"question":"What is a \"primary feeder\" in distribution systems?","options":{"A":"A feeder that eats first","B":"Main high-voltage cables (typically 4-34 kV) that carry power from substations to distribution transformers throughout service territory, forming the backbone of distribution","C":"A secondary circuit","D":"Transmission lines","E":"Service entrance conductors"},"answer":"B","answer_text":"Main high-voltage cables (typically 4-34 kV) that carry power from substations to distribution transformers throughout service territory, forming the backbone of distribution","rationale":"Primary feeders are the major distribution circuits at higher voltage. Multiple primary feeders radiate from each substation, each serving numerous distribution transformers. LADWP primary feeders are typically underground in urban areas and overhead in suburban/rural areas. Primary feeder reliability is critical to system reliability."},{"id":222,"question":"What is the function of a \"substation\" in the electrical system? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"A smaller power station","B":"A facility that steps voltage up or down and switches/protects power flows, serving as a hub between transmission and distribution systems or between different distribution voltage levels","C":"A supply depot","D":"A training facility","E":"A storage facility"},"answer":"B","answer_text":"A facility that steps voltage up or down and switches/protects power flows, serving as a hub between transmission and distribution systems or between different distribution voltage levels","rationale":"Substations house transformers, breakers, switches, and protective equipment. Transmission substations receive high-voltage power and step it down to distribution voltage. Distribution substations receive primary distribution voltage and step it down to secondary voltage for customer use. LADWP operates hundreds of substations."},{"id":223,"question":"What is the purpose of \"substation grounding systems\"?","options":{"A":"To ground equipment only","B":"Multiple interconnected ground rods and grid conductors that establish low- resistance paths for fault currents and equalize potential within the substation, protecting equipment and personnel from dangerous voltages","C":"To reduce cost","D":"To improve voltage","E":"To measure current"},"answer":"B","answer_text":"Multiple interconnected ground rods and grid conductors that establish low-resistance paths for fault currents and equalize Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) potential within the substation, protecting equipment and personnel from dangerous voltages","rationale":"Substation grounding systems include driven ground rods in a grid pattern connected by conductors buried several feet below surface. This provides low-resistance paths for fault currents and ensures uniform potential throughout the substation, preventing dangerous voltage gradients. LADWP substation grounding is tested regularly and maintained at low resistance."},{"id":224,"question":"What is the meaning of \"service reliability\" in utilities?","options":{"A":"Friendly customer service","B":"The percentage of time customers receive continuous electrical service without interruption, measured as uptime percentage or outage duration and frequency","C":"Quick response to calls","D":"Low electricity rates","E":"Good communication"},"answer":"B","answer_text":"The percentage of time customers receive continuous electrical service without interruption, measured as uptime percentage or outage duration and frequency","rationale":"Reliability metrics like SAIDI (System Average Interruption Duration Index) and SAIFI (System Average Interruption Frequency Index) measure how long and how often customers experience outages. LADWP reports reliability metrics publicly and works to improve them through system upgrades and maintenance. Higher reliability justifies infrastructure investments."},{"id":225,"question":"What is the purpose of \"vegetation management\" in utility operations?","options":{"A":"Growing trees near lines Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"Trimming trees and removing vegetation away from overhead lines to prevent outages caused by falling branches and to reduce wildfire risk in fire-prone areas","C":"Landscaping","D":"Environmental conservation","E":"Aesthetic improvement"},"answer":"B","answer_text":"Trimming trees and removing vegetation away from overhead lines to prevent outages caused by falling branches and to reduce wildfire risk in fire-prone areas","rationale":"Trees contacting power lines cause most weather-related outages. Proactive trimming maintains clearances and reduces outages. In wildfire-prone regions like LADWP territory, vegetation management is critical to fire prevention. LADWP crews regularly trim trees near distribution lines and maintain clearance zones."},{"id":226,"question":"What is the function of \"automated meter reading\" (AMR) systems?","options":{"A":"Faster manual meter reading","B":"Electronic devices that automatically record and transmit meter readings to LADWP systems, eliminating manual reading and enabling time-of-use rates and usage monitoring**","C":"Digital displays","D":"Data storage","E":"Billing acceleration"},"answer":"B","answer_text":"Electronic devices that automatically record and transmit meter readings to LADWP systems, eliminating manual reading and enabling time-of-use rates and usage monitoring","rationale":"AMR meters send usage data automatically, often wirelessly, to utility systems. This enables accurate billing, time-of-use pricing, and rapid outage Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) detection. AMR is the foundation of smart grid technology. LADWP is deploying AMR systems (advanced metering infrastructure or AMI) throughout its service territory."},{"id":227,"question":"What is net metering/net energy metering for customer-owned renewable generation?","options":{"A":"Measuring net usage only with no generation credit","B":"A billing arrangement under which eligible customer generation can supply energy to the grid and credits are calculated under the applicable utility program and rate rules","C":"Removing all electricity charges","D":"Providing free electricity","E":"Eliminating the electric meter"},"answer":"B","answer_text":"A billing arrangement under which eligible customer generation can supply energy to the grid and credits are calculated under the applicable utility program and rate rules","rationale":"Net metering is a billing arrangement for eligible customer generation. The treatment and value of exported energy depend on the applicable utility program, tariff, and rate rules; 'retail-rate credit' should not be treated as a universal rule."},{"id":228,"question":"What is a \"time-of-use\" (TOU) rate structure?","options":{"A":"Different pricing for business hours Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"Electricity rates that vary by time of day and season, charging higher rates during peak demand periods and lower rates during off-peak times to incentivize load shifting","C":"Time-based billing**","D":"Monthly rates**","E":"Average pricing**"},"answer":"B","answer_text":"Electricity rates that vary by time of day and season, charging higher rates during peak demand periods and lower rates during off- peak times to incentivize load shifting","rationale":"TOU pricing encourages customers to shift usage to off-peak hours (nights, early mornings, weekends) when demand is lower and rates are cheaper. This flattens the demand curve, reducing peak generating capacity needs. LADWP offers TOU rates for some customers; some are mandatory for large commercial users."},{"id":229,"question":"What is the purpose of \"demand charge\" components in electricity bills?","options":{"A":"Customer service fee","B":"A charge based on peak power consumption during a billing period, encouraging customers to reduce maximum demand and spreading infrastructure costs based on system capacity requirements","C":"Equipment rental","D":"Meter rental","E":"Administrative fee"},"answer":"B","answer_text":"A charge based on peak power consumption during a billing period, encouraging customers to reduce maximum demand and spreading infrastructure costs based on system capacity requirements Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Demand charges reflect the peak kW usage during a billing period, not total energy consumption. Large power draws (like motors starting) create demand spikes that increase system costs. Demand charges incentivize customers to manage peak loads. Industrial customers have significant demand charges; residential customers typically don't."},{"id":230,"question":"What is an \"outage management system\" (OMS)?","options":{"A":"Complaint handling system","B":"Computer system that tracks electrical outages, identifies affected customers, optimizes crew dispatching, and coordinates restoration efforts to restore service quickly**","C":"Customer service platform","D":"Billing system","E":"Communications network"},"answer":"B","answer_text":"Computer system that tracks electrical outages, identifies affected customers, optimizes crew dispatching, and coordinates restoration efforts to restore service quickly","rationale":"OMS systems detect outages, estimate restoration times, dispatch crews, and track restoration progress. OMS integrates with SCADA and meter systems to quickly identify problems and estimate outage scope. LADWP OMS provides real-time customer outage information and dispatch optimization."},{"id":231,"question":"What is the function of a \"feeder protection relay\"?","options":{"A":"Protects cables from weather Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"Electronic device that monitors feeder current and voltage, detecting faults and signaling breakers to open and isolate the faulted feeder to protect equipment and minimize outage impacts","C":"A circuit breaker","D":"A surge protector","E":"A voltage regulator"},"answer":"B","answer_text":"Electronic device that monitors feeder current and voltage, detecting faults and signaling breakers to open and isolate the faulted feeder to protect equipment and minimize outage impacts","rationale":"Feeder protection relays (microprocessor-based in modern systems) continuously monitor electrical parameters on distribution feeders. When faults occur, relays detect abnormal conditions and command breakers to open, isolating the fault. Relay settings are coordinated for selective protection. LADWP protection relays are tested regularly per maintenance programs."},{"id":232,"question":"What is reactive power in an AC electrical system?","options":{"A":"Power that reacts to changes in weather","B":"Power associated with energy exchange between electric and magnetic fields in inductive and capacitive elements, measured in VAR","C":"A mandatory emergency charge","D":"Only peak-demand pricing","E":"A maintenance fee"},"answer":"B","answer_text":"Power associated with energy exchange between electric and magnetic fields in inductive and capacitive elements, measured in VAR","rationale":"Reactive power is measured in volt-amperes reactive (VAR). Inductors and capacitors exchange reactive energy with the system, affecting current, apparent power, and power factor."},{"id":233,"question":"Why can a low power factor increase the cost or capacity requirements of an electrical system?","options":{"A":"It is automatically a government fine","B":"For a given real power, low power factor increases current and apparent power, which can increase losses and equipment capacity requirements; a utility may also have tariff provisions related to power factor","C":"It always creates a safety fee","D":"It eliminates maintenance charges","E":"It makes voltage zero"},"answer":"B","answer_text":"For a given real power, low power factor increases current and apparent power, which can increase losses and equipment capacity requirements; a utility may also have tariff provisions related to power factor","rationale":"For a given real power, lower power factor means higher current and apparent power. That can increase system losses and the capacity required from conductors and equipment. Whether a utility applies a specific billing charge depends on its current tariff."},{"id":234,"question":"What is the function of a \"differential relay\"?","options":{"A":"Measures voltage differences Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"Protective relay that detects internal faults in transformers by comparing current on primary and secondary sides, operating immediately when fault occurs inside the transformer**","C":"A current relay","D":"An overcurrent relay","E":"A distance relay"},"answer":"B","answer_text":"Protective relay that detects internal faults in transformers by comparing current on primary and secondary sides, operating immediately when fault occurs inside the transformer","rationale":"Differential relays (Buchholz relays, electrical differential relays) compare power flowing in versus power flowing out. When internal transformer faults occur, current mismatch is detected immediately before damage is severe. Differential protection is the best protection for transformers. LADWP large transformers have differential protection."},{"id":235,"question":"What is a \"distance relay\" and its purpose?","options":{"A":"Measures distance to faults","B":"Protective relay that operates based on calculated distance to fault (using voltage and current measurements), providing zone protection with primary, secondary, and backup zones for coordinated protection of transmission and sub-transmission lines","C":"A ground fault relay","D":"An overcurrent relay","E":"A speed relay"},"answer":"B","answer_text":"Protective relay that operates based on calculated distance to fault (using voltage and current measurements), providing zone Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) protection with primary, secondary, and backup zones for coordinated protection of transmission and sub-transmission lines","rationale":"Distance relays calculate apparent impedance to the fault and determine whether it's in their protection zone. Zone 1 (80% of line) operates instantaneously; Zone 2 (full line plus safety margin) operates with slight delay; Zone 3 (extends beyond line) operates with longer delay for backup protection. Distance relays enable coordination on long lines. LADWP uses distance protection on transmission lines."},{"id":236,"question":"What is the purpose of \"relay testing\" and \"calibration\"?","options":{"A":"Making sure relays work","B":"Periodic verification that protective relays operate at correct settings and respond correctly to fault conditions, ensuring proper protection system function and safety","C":"Replacing relays","D":"Updating software","E":"Measuring response time"},"answer":"B","answer_text":"Periodic verification that protective relays operate at correct settings and respond correctly to fault conditions, ensuring proper protection system function and safety","rationale":"Relays must be tested regularly (annually or per maintenance schedules) to ensure they trip at specified currents and times. Calibration verifies settings match design. A relay failing to operate during a fault could allow equipment damage or personnel injury. LADWP relay testing is documented and tracked."},{"id":237,"question":"Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) What is the function of \"SCADA\" (Supervisory Control and Data Acquisition) systems?","options":{"A":"Secure camera systems","B":"Computer systems that remotely monitor electrical system conditions and control equipment, allowing operators to manage power flow, detect problems, and respond to emergencies from a central location","C":"Security systems","D":"Video surveillance","E":"Access control"},"answer":"B","answer_text":"Computer systems that remotely monitor electrical system conditions and control equipment, allowing operators to manage power flow, detect problems, and respond to emergencies from a central location","rationale":"SCADA systems collect real-time data from thousands of field devices (substations, switches, meters, relays) and display it at control centers. Operators can remotely switch equipment, adjust voltage, and respond to events. SCADA is essential for reliable grid operation. LADWP SCADA systems monitor and control power flow throughout service territory."},{"id":238,"question":"What is the meaning of \"islanding\" in electrical systems?","options":{"A":"Operating in isolated locations","B":"Unintended separation of a portion of the electrical grid from the main system due to faults or equipment operations, potentially causing voltage and frequency instability**","C":"Backup power operation","D":"Intentional isolation","E":"Emergency operation Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"Unintended separation of a portion of the electrical grid from the main system due to faults or equipment operations, potentially causing voltage and frequency instability","rationale":"Unintentional islanding occurs when a feeder is isolated but continues to receive generation from distributed sources. This can cause dangerous voltage and frequency conditions. Anti-islanding relays detect islanding and disconnect distributed generation. LADWP requires anti-islanding protection on customer- owned generation."},{"id":239,"question":"What is the purpose of \"phase angle regulating transformers\" (PART) in power systems?","options":{"A":"Measuring phase angles","B":"Transformers with controllable tap positions that adjust the phase angle between transmission line voltages, improving power flow control and system stability in interconnected grids","C":"Standard transformers","D":"Voltage regulators","E":"Isolation transformers"},"answer":"B","answer_text":"Transformers with controllable tap positions that adjust the phase angle between transmission line voltages, improving power flow control and system stability in interconnected grids","rationale":"PARTs can adjust the phase relationship between connected circuits, affecting power flow distribution. They are used on transmission lines to manage power flows in complex interconnected systems. PARTs are expensive but provide precise control for grid operators. LADWP may use PARTs in future grid modernization. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":240,"question":"What is a \"synchronous reference frame\" in power system analysis?","options":{"A":"A time frame**","B":"A mathematical reference point rotating at system fundamental frequency (60 Hz), used for analyzing three-phase systems and power electronics in a simplified two-phase coordinate system**","C":"A location**","D":"A protection scheme**","E":"A type of transformer**"},"answer":"B","answer_text":"A mathematical reference point rotating at system fundamental frequency (60 Hz), used for analyzing three-phase systems and power electronics in a simplified two-phase coordinate system","rationale":"Synchronous reference frames (d-q frames) simplify three-phase AC analysis by converting to equivalent two-phase DC-like systems. This is essential for designing VFD controls, power factor correction, and stability analysis. Modern power electronics use reference frame analysis extensively. Understanding this is important for advanced LADWP work."},{"id":241,"question":"What is the purpose of \"harmonic analysis\" in power systems?","options":{"A":"Measuring musical frequencies","B":"Calculating non-linear load current distortion and its effects on transformers, motors, and cables to determine if harmonic filtering is needed and plan system upgrades","C":"Testing equipment","D":"Tuning systems","E":"Calibrating meters Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"Calculating non-linear load current distortion and its effects on transformers, motors, and cables to determine if harmonic filtering is needed and plan system upgrades","rationale":"Harmonic analysis quantifies harmonic content from non-linear loads and predicts effects on system equipment. High harmonic content causes overheating and accelerated aging. LADWP performs harmonic analysis at locations with significant non-linear loads and designs filtering accordingly. Modern energy monitoring includes harmonic measurement."},{"id":242,"question":"What is a \"resonant frequency\" in electrical circuits?","options":{"A":"A frequency that resonates sound","B":"The frequency at which inductive and capacitive reactances are equal, causing maximum current flow and potential amplification of voltage and current if not properly damped**","C":"The operating frequency","D":"The power frequency","E":"The audible frequency"},"answer":"B","answer_text":"The frequency at which inductive and capacitive reactances are equal, causing maximum current flow and potential amplification of voltage and current if not properly damped","rationale":"At resonance (when XL = XC), impedance is minimum and current is maximum. For a series circuit at resonance, impedance equals resistance only. Parallel resonance causes high impedance. System resonances can amplify harmonics; filter design must avoid resonating at harmonic frequencies. LADWP filter design accounts for resonance."},{"id":243,"question":"Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) What is the function of \"distribution automation\" in modern grids?","options":{"A":"Automating meter reading","B":"Computer systems that automatically reconfigure distribution circuits, optimize voltage, and isolate faults using field sensors and intelligent switches to improve reliability and efÏciency without operator intervention**","C":"Automatic meter reading**","D":"Billing automation**","E":"Communication systems**"},"answer":"B","answer_text":"Computer systems that automatically reconfigure distribution circuits, optimize voltage, and isolate faults using field sensors and intelligent switches to improve reliability and efÏciency without operator intervention","rationale":"Distribution automation uses field devices (fault indicators, reclosers, intelligent switches) that communicate with central systems and operate automatically. When faults occur, the system can isolate faults and reconfigure to restore service to unaffected areas without waiting for crew response. LADWP is implementing distribution automation selectively."},{"id":244,"question":"What is the meaning of \"microgrids\" in modern power systems?","options":{"A":"Small electrical systems","B":"Localized electrical systems that can operate connected to the main grid or independently, typically including generation, storage, and controllable loads with advanced control systems**","C":"Subgrid systems","D":"Backup systems","E":"Test facilities Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"Localized electrical systems that can operate connected to the main grid or independently, typically including generation, storage, and controllable loads with advanced control systems","rationale":"Microgrids at universities, military bases, or industrial facilities can disconnect from the utility and operate independently during emergencies or high- price periods. They balance local generation (solar, wind, backup generation) and controllable loads (HVAC, water heating). LADWP customers are developing microgrids for resilience."},{"id":245,"question":"What is the purpose of \"energy storage\" systems in utilities?","options":{"A":"Storing excess power indefinitely","B":"Capturing excess generation during low-demand periods and discharging during peak demand, improving efÏciency and reducing need for peaking generation, and providing frequency support**","C":"Emergency backup only","D":"Renewable energy only","E":"Load reduction only"},"answer":"B","answer_text":"Capturing excess generation during low-demand periods and discharging during peak demand, improving efÏciency and reducing need for peaking generation, and providing frequency support","rationale":"Energy storage (batteries, flywheels, compressed air, pumped hydro) absorbs excess generation and stores it for later use. This allows higher renewable penetration and reduces peaking plant needs. Storage provides frequency support during disturbances. LADWP is deploying battery storage at strategic locations."},{"id":246,"question":"What is a \"frequency event\" in power systems? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"Regular occurrences","B":"Sudden changes in system frequency when generation and load become unbalanced, requiring automatic frequency response and potential load shedding if severe**","C":"Routine operation","D":"Normal fluctuation","E":"Testing event"},"answer":"B","answer_text":"Sudden changes in system frequency when generation and load become unbalanced, requiring automatic frequency response and potential load shedding if severe","rationale":"When large generators suddenly fail or loads spike, system frequency changes. Drooping governors automatically adjust generation. If frequency drops too much, load shedding disconnects loads. Frequency must remain between 59.5- 60.5 Hz for most equipment to function properly. LADWP participates in frequency support."},{"id":247,"question":"What is the meaning of \"voltage collapse\" in power systems?","options":{"A":"Voltage dropping slowly","B":"Uncontrolled voltage decline leading to complete system failure when voltage regulation devices are exhausted, potentially causing widespread blackouts**","C":"Low voltage condition","D":"Temporary voltage dip","E":"Overvoltage condition"},"answer":"B","answer_text":"Uncontrolled voltage decline leading to complete system failure when voltage regulation devices are exhausted, potentially causing widespread blackouts Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Voltage collapse occurs when reactive power demand exceeds supply and all regulation devices are at limits. Voltage continues declining uncontrollably, equipment fails, and the system blacks out. Prevention requires adequate reactive power sources and load reduction. LADWP voltage stability is monitored continuously."},{"id":248,"question":"What is the function of \"synchronized phasor measurement units\" (PMUs) in modern grids?","options":{"A":"Measuring electricity usage","B":"High-speed devices that measure voltage and current phasors with precise timing, enabling real-time monitoring of grid dynamics and early warning of stability problems**","C":"Counting frequency","D":"Measuring harmonics","E":"Detecting faults"},"answer":"B","answer_text":"High-speed devices that measure voltage and current phasors with precise timing, enabling real-time monitoring of grid dynamics and early warning of stability problems","rationale":"PMUs measure voltage and current at high speed (30 times per second) with GPS time-sync precision, enabling detection of instabilities in milliseconds. PMU data from many locations allows real-time monitoring of grid stability. LADWP is deploying PMUs to improve system visibility and response."},{"id":249,"question":"What is the meaning of \"wide-area monitoring\" in power systems?","options":{"A":"Monitoring large geographic areas Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"Real-time collection and analysis of data from PMUs across a wide geographic area to detect system problems and coordinate automated responses for enhanced stability and reliability","C":"Utility monitoring**","D":"Customer monitoring**","E":"Equipment tracking**"},"answer":"B","answer_text":"Real-time collection and analysis of data from PMUs across a wide geographic area to detect system problems and coordinate automated responses for enhanced stability and reliability","rationale":"Wide-area systems collect PMU data across multiple utilities and control areas, enabling detection of problems like oscillations or instability that develop over large distances. Automated responses can stabilize the grid before problems cascade. LADWP participates in California wide-area monitoring systems."},{"id":250,"question":"What is the purpose of \"demand side management\" (DSM) programs?","options":{"A":"Reducing customer service demand","B":"Programs that encourage customers to reduce energy consumption or shift usage to off-peak times, reducing peak demand and system costs while improving efÏciency**","C":"Supply management**","D":"Load reduction only**","E":"EfÏciency only**"},"answer":"B","answer_text":"Programs that encourage customers to reduce energy consumption or shift usage to off-peak times, reducing peak demand and system costs while improving efÏciency","rationale":"DSM includes rebates for efÏcient equipment, time-of-use pricing, demand response programs, and conservation campaigns. By reducing peak Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) demand, DSM reduces need for expensive peaking plants and improves system reliability. LADWP DSM programs offer rebates and incentives for customers."},{"id":251,"question":"What is a \"static VAR compensator\" (SVC) in power systems?","options":{"A":"A static filter","B":"Device using capacitors and reactors with thyristor control to dynamically adjust reactive power output, supporting voltage and improving system stability during disturbances**","C":"A transformer","D":"A circuit breaker","E":"A regulator"},"answer":"B","answer_text":"Device using capacitors and reactors with thyristor control to dynamically adjust reactive power output, supporting voltage and improving system stability during disturbances","rationale":"SVCs rapidly adjust reactive power output to maintain voltage during transients and dynamic events. They respond much faster than tap-changing transformers. SVCs are expensive but provide superior voltage support for grid stability. LADWP may use SVCs in future system upgrades."},{"id":252,"question":"What is the function of a \"unified power flow controller\" (UPFC) in transmission systems?","options":{"A":"Controlling power flow only","B":"Advanced power electronics device combining series and shunt converters to simultaneously control voltage, impedance, and phase angle, optimizing power flow and improving system stability** Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","C":"A transformer","D":"A circuit breaker","E":"A regulator"},"answer":"B","answer_text":"Advanced power electronics device combining series and shunt converters to simultaneously control voltage, impedance, and phase angle, optimizing power flow and improving system stability","rationale":"UPFCs use power semiconductors to provide independent control of voltage (shunt) and impedance/phase angle (series). This enables precise control impossible with traditional devices. UPFCs are the most sophisticated power flow control devices. LADWP transmission may incorporate UPFCs in future upgrades."},{"id":253,"question":"What is the meaning of \"congestion\" in power systems?","options":{"A":"TrafÏc-like congestion","B":"Transmission or distribution lines operating at or near capacity limits, restricting power flow and potentially causing reliability problems or high localized electricity prices**","C":"Overcrowding","D":"TrafÏc delays","E":"Equipment failure"},"answer":"B","answer_text":"Transmission or distribution lines operating at or near capacity limits, restricting power flow and potentially causing reliability problems or high localized electricity prices","rationale":"When lines are congested, power cannot flow freely to areas with high demand. Localized shortages cause high prices. Congestion is addressed by building new lines, improving efÏciency, or reducing loads. LADWP system upgrades target congestion-prone areas to improve reliability and reduce costs. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":254,"question":"What is the purpose of \"transmission expansion\" planning?","options":{"A":"Building longer transmission lines","B":"Identifying future transmission needs based on load growth and congestion, planning new line construction or upgrades to maintain reliability and accommodate development**","C":"Increasing capacity","D":"Replacing old equipment","E":"Improving efÏciency**"},"answer":"B","answer_text":"Identifying future transmission needs based on load growth and congestion, planning new line construction or upgrades to maintain reliability and accommodate development","rationale":"Long-term transmission planning forecasts load growth, identifies congestion, and designs solutions. Planning involves years of environmental review and permitting. LADWP participates in regional transmission planning with Southern California Edison and San Diego Gas & Electric to coordinate development."},{"id":255,"question":"What is a \"black start capability\" in power plants?","options":{"A":"Fast startup**","B":"Ability to startup and energize transmission lines without external power supply after blackouts, essential for system restoration following widespread outages","C":"Emergency operation","D":"Backup power","E":"Rapid response Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"Ability to startup and energize transmission lines without external power supply after blackouts, es
