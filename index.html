ositive terminal and negative lead to negative terminal; reversed polarity can damage equipment or prevent operation","rationale":"DC devices are polarity-sensitive. Reversing positive and negative connections can damage components, especially semiconductors and some motors. Proper connection follows manufacturer specifications. On LADWP backup systems using batteries, correct polarity is critical for safe operation. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":95,"question":"What is a \"harmonic\" in electrical systems?","options":{"A":"A musical sound in power lines","B":"Distortion of normal sine wave caused by non-linear loads, which can cause overheating and equipment damage if not controlled","C":"A type of circuit breaker","D":"A measure of voltage","E":"A grounding technique"},"answer":"B","answer_text":"Distortion of normal sine wave caused by non-linear loads, which can cause overheating and equipment damage if not controlled","rationale":"Non-linear loads (computers, adjustable speed drives, LED ballasts) draw current in short pulses rather than sinusoidally, creating harmonic currents at multiples of the fundamental 60 Hz frequency. Harmonics increase heating and can damage transformers, motors, and capacitors. LADWP monitors harmonics on systems with significant non-linear loads."},{"id":96,"question":"What is the purpose of equipment bonding straps?","options":{"A":"To hold equipment in place","B":"To create low-resistance paths between metal equipment parts and the main grounding system, preventing dangerous voltage differences","C":"To reduce equipment weight","D":"To increase equipment strength","E":"To measure electrical properties"},"answer":"B","answer_text":"To create low-resistance paths between metal equipment parts and the main grounding system, preventing dangerous voltage differences Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Bonding straps (usually copper strap or wire) connect equipment frames, cable armor, conduit, and other conductive parts to each other and to the grounding system. This ensures all metal surfaces are at equal potential, preventing shock hazards. LADWP requires bonding on all major equipment and cable systems."},{"id":97,"question":"What does the ampere rating of an electrical device indicate?","options":{"A":"The temperature the device can withstand","B":"The current rating the device is designed to carry under specified conditions","C":"The voltage the device requires","D":"The physical size of the device","E":"The weight of the device"},"answer":"B","answer_text":"The current rating the device is designed to carry under specified conditions","rationale":"An ampere rating identifies the current capacity or rating of a device under specified conditions. It should not automatically be interpreted as an unrestricted 'safe continuous current' for every device."},{"id":98,"question":"What is the primary purpose of an isolation transformer?","options":{"A":"To increase voltage","B":"To provide galvanic isolation between the input and output circuits","C":"To reduce current in every application","D":"To disconnect circuits","E":"To measure voltage"},"answer":"B","answer_text":"To provide galvanic isolation between the input and output circuits","rationale":"An isolation transformer electrically separates its primary and secondary circuits. This can help address certain shock, grounding, and noise issues depending on the application, but an isolation transformer should not be treated as a universal surge-protection device."},{"id":99,"question":"Under standard NEC conditions for direct-buried cable, what is the commonly required minimum cover for a 0-600V installation before applicable exceptions?","options":{"A":"6 inches","B":"12 inches","C":"18 inches","D":"24 inches","E":"36 inches"},"answer":"D","answer_text":"24 inches","rationale":"NEC Table 300.5 commonly specifies 24 inches of minimum cover for direct-buried residential branch circuits and feeder conductors rated 0-600V in the applicable column, but burial depth varies by wiring method, location, and listed exceptions."},{"id":100,"question":"Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) What does \"demand factor\" mean in load calculations?","options":{"A":"The percentage of connected load that will actually operate simultaneously**","B":"The total of all circuit loads","C":"The diversity factor","D":"The peak load of the system","E":"The starting current"},"answer":"A","answer_text":"The percentage of connected load that will actually operate simultaneously","rationale":"Demand factor recognizes that not all circuits operate at full capacity simultaneously. For example, a residential service might have 40 kW of connected load but a demand factor of 0.4, so the actual demand is 16 kW. NEC Article 220 provides demand factors for various loads. LADWP uses demand factors to size services economically without undersizing."},{"id":101,"question":"What is the purpose of service drop strain relief?","options":{"A":"To make installation easier","B":"To support the weight of overhead service conductors and prevent stress on connections to building or utility equipment","C":"To measure cable tension","D":"To insulate the service drop","E":"To regulate voltage"},"answer":"B","answer_text":"To support the weight of overhead service conductors and prevent stress on connections to building or utility equipment","rationale":"Service drop strain relief (weatherhead or service riser clamp) supports the weight of incoming service conductors and prevents mechanical stress on the connections where the service enters the building. This protection Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) prevents damage that could create fire or shock hazards. NEC requires proper strain relief at all service entries."},{"id":102,"question":"What is the function of a dimmer switch?","options":{"A":"To turn lights completely off","B":"To reduce the brightness of lights by controlling the voltage or current through the load","C":"To change light color","D":"To provide emergency lighting","E":"To measure light intensity"},"answer":"B","answer_text":"To reduce the brightness of lights by controlling the voltage or current through the load","rationale":"Dimmer switches reduce light output by decreasing voltage to the lamp (incandescent dimmers) or modulating current (LED dimmers). This saves energy and extends lamp life. Dimmers must be properly rated for the load type (incandescent, LED, CFL) to function safely. LADWP installations include dimmers in many applications."},{"id":103,"question":"What is a \"hot\" conductor?","options":{"A":"A conductor carrying AC current that is always warm","B":"An ungrounded conductor carrying current from the source, identified by black, red, or other colors except white, green, or bare**","C":"A conductor that is damaged","D":"A transformer winding Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"A conductor that conducts heat"},"answer":"B","answer_text":"An ungrounded conductor carrying current from the source, identified by black, red, or other colors except white, green, or bare","rationale":"Hot (ungrounded) conductors carry current from the source through load to neutral/ground. They are hazardous and can cause shock or arc flash. Proper identification by color (black, red, blue) is essential for safety. LADWP circuits clearly identify hot conductors to prevent accidental contact."},{"id":104,"question":"What is the typical efÏciency of an electrical transformer?","options":{"A":"50%","B":"70%","C":"85%","D":"95% or higher","E":"100% (no losses)"},"answer":"D","answer_text":"95% or higher","rationale":"Most modern transformers have efÏciency ratings of 95-99%, meaning 95-99% of input power is transferred to output with only 5-1% loss as heat in the core and windings. Larger transformers tend to be more efÏcient than smaller ones. LADWP transformers are designed and maintained for high efÏciency to minimize losses."},{"id":105,"question":"What is the primary purpose of a circuit diagram?","options":{"A":"For decoration","B":"To show how electrical components are connected and allow understanding of circuit operation, design, and troubleshooting Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","C":"To measure current","D":"To show physical equipment location","E":"To calculate voltage"},"answer":"B","answer_text":"To show how electrical components are connected and allow understanding of circuit operation, design, and troubleshooting","rationale":"Circuit diagrams (schematics) use symbols to show how components are electrically connected. They do not necessarily show physical locations. Technicians use diagrams to understand circuit function, troubleshoot problems, modify circuits, and document systems. LADWP systems documentation includes detailed circuit diagrams for all equipment."},{"id":106,"question":"What is the meaning of \"standing voltage\" on a circuit?","options":{"A":"Voltage that only applies in the morning","B":"Voltage present at a point in the circuit when no load current is flowing**","C":"The maximum possible voltage","D":"Voltage that changes constantly","E":"Voltage in overhead lines only"},"answer":"B","answer_text":"Voltage present at a point in the circuit when no load current is flowing","rationale":"Standing voltage (open-circuit voltage) is the potential difference that exists when no current flows. When load current begins, standing voltage reduces due to voltage drop across resistance. Measuring standing voltage helps diagnose circuit problems. LADWP uses standing voltage measurements in troubleshooting procedures."},{"id":107,"question":"Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) What is the purpose of a lightning rod system?","options":{"A":"To create lightning","B":"To provide a safe, low-resistance path for lightning current directly to ground, protecting structures from lightning damage","C":"To prevent all lightning strikes","D":"To measure lightning intensity","E":"To conduct electricity from the utility"},"answer":"B","answer_text":"To provide a safe, low-resistance path for lightning current directly to ground, protecting structures from lightning damage","rationale":"Lightning rods (air terminals) on building peaks connect via heavy conductors to ground rods, creating a preferred path for lightning that diverts it from damaging structures. The system includes air terminals, conductors, and grounding electrodes sized to safely handle lightning current. LADWP substations and high structures use lightning protection systems."},{"id":108,"question":"What is the function of an autotransformer?","options":{"A":"To automatically start equipment","B":"To step voltage up or down more economically than standard transformers by sharing part of the winding between primary and secondary circuits","C":"To measure voltage**","D":"To disconnect circuits","E":"To provide power to automobiles"},"answer":"B","answer_text":"To step voltage up or down more economically than standard transformers by sharing part of the winding between primary and secondary circuits Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Autotransformers use a single winding with multiple taps, reducing core size and cost compared to conventional transformers. However, autotransformers lack galvanic isolation, so they cannot be used to isolate circuits from ground. LADWP uses autotransformers for some voltage regulation applications where isolation is not required."},{"id":109,"question":"What is the purpose of splicing and terminating conductors correctly?","options":{"A":"For appearance only","B":"To maintain electrical continuity, mechanical strength, and prevent corrosion or loose connections that could cause overheating, arcing, or equipment damage","C":"Splicing does not matter","D":"To save wire","E":"To increase resistance"},"answer":"B","answer_text":"To maintain electrical continuity, mechanical strength, and prevent corrosion or loose connections that could cause overheating, arcing, or equipment damage","rationale":"Proper splicing ensures low resistance, mechanical strength, and permanent connection. Poor splicing leads to loose connections that heat up, potentially causing fire. Terminations must use proper lugs or terminals sized for the wire. LADWP requires all splices and terminations to pass rigorous inspection and testing protocols."},{"id":110,"question":"What is a \"clamp\" on a cable lug used for?","options":{"A":"To measure cable tension","B":"To secure the cable to the lug, preventing rotation and ensuring proper electrical contact pressure Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","C":"To insulate the lug","D":"To measure current","E":"To protect the conductor"},"answer":"B","answer_text":"To secure the cable to the lug, preventing rotation and ensuring proper electrical contact pressure","rationale":"Cable clamps (also called crimps or swages) deform the terminal lug permanently onto the cable conductor. This mechanical bond, combined with the lug's contact area, provides reliable electrical connection with low and stable resistance. Improper crimping leads to high-resistance connections that overheat. LADWP uses calibrated crimping tools to ensure proper clamping."},{"id":111,"question":"What is the purpose of electrical conduit support clamps?","options":{"A":"To insulate conduit","B":"To prevent conduit from sagging or moving, maintaining proper alignment and protection of conductors inside","C":"To measure conduit strength","D":"To disconnect circuits","E":"To route water away"},"answer":"B","answer_text":"To prevent conduit from sagging or moving, maintaining proper alignment and protection of conductors inside","rationale":"Support clamps hold conduit securely at regular intervals (typically 3 feet or as required by NEC 300.19). Proper support prevents sagging that could damage conductors or create code violations. Clamps must be appropriate for conduit type and installation environment (indoor, outdoor, underground). LADWP installations include proper support at all required locations. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":112,"question":"What does \"corrosion\" mean in electrical systems?","options":{"A":"Normal aging of equipment","B":"Chemical deterioration of conductors or equipment that increases resistance and can cause connection failure or equipment malfunction","C":"Rust on painted surfaces","D":"Water infiltration only","E":"Normal wear and tear"},"answer":"B","answer_text":"Chemical deterioration of conductors or equipment that increases resistance and can cause connection failure or equipment malfunction","rationale":"Corrosion (oxidation, galvanic corrosion) attacks unprotected metals, forming high-resistance oxide layers. This causes voltage drops, overheating, and equipment failure. Protection methods include proper insulation, coatings, dissimilar metal avoidance, and grounding. LADWP locations with salt air or chemical exposure require special corrosion-resistant materials."},{"id":113,"question":"What is the purpose of a knife switch bypass in motor control?","options":{"A":"To complicate the circuit","B":"To allow operators to maintain power to control circuits while disconnecting the motor, enabling safe control device operation during maintenance","C":"To increase motor power","D":"To reduce voltage"},"answer":"B","answer_text":"To allow operators to maintain power to control circuits while disconnecting the motor, enabling safe control device operation during maintenance","rationale":"A bypass switch around the motor disconnect allows control power to remain on while the motor is de-energized during maintenance. This keeps indicator lights, fans, and other auxiliary equipment running without exposing workers to the hazard of energized motor terminals. LADWP motor controls include bypass switches where appropriate."},{"id":114,"question":"What is the function of cable armor or shielding?","options":{"A":"For appearance","B":"To protect inner conductors from mechanical damage, moisture, and electromagnetic interference","C":"To increase voltage**","D":"To measure current","E":"To change wire color"},"answer":"B","answer_text":"To protect inner conductors from mechanical damage, moisture, and electromagnetic interference","rationale":"Cable armor (metal braid) and shielding protect conductors from physical damage and external electromagnetic interference. Shielding also helps control electric fields around high-voltage cables. The armor/shield must be properly grounded for EMI protection. LADWP uses armored cable in exposed locations and high-interference environments."},{"id":115,"question":"What is \"capacitive coupling\" in electrical systems?","options":{"A":"Connecting capacitors in series Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"Unintended coupling of electrical signals through capacitive effects between nearby conductors, which can cause interference","C":"A type of transformer","D":"A motor control technique","E":"A grounding method"},"answer":"B","answer_text":"Unintended coupling of electrical signals through capacitive effects between nearby conductors, which can cause interference","rationale":"Conductors in close proximity can couple signals through capacitive effects, causing interference with nearby circuits. This is especially problematic with low-level signal circuits near high-voltage lines. Proper spacing, shielding, and grounding minimize capacitive coupling. LADWP routing of cables separates high and low voltage circuits."},{"id":116,"question":"What is \"inductive coupling\" in electrical systems?","options":{"A":"Connecting inductors in series","B":"Unintended coupling of electromagnetic fields between circuits, inducing unwanted voltage in nearby conductors**","C":"A type of transformer","D":"A battery connection method","E":"A grounding technique"},"answer":"B","answer_text":"Unintended coupling of electromagnetic fields between circuits, inducing unwanted voltage in nearby conductors","rationale":"Changing current in one conductor creates a changing magnetic field that can induce voltage in nearby conductors. This inductive coupling can introduce noise or interfering signals. Twisting conductors, using shielding, or separating circuits reduces inductive coupling. LADWP designs systems to minimize coupling through proper cable routing and practice. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":117,"question":"What is the purpose of electrical system commissioning?","options":{"A":"To celebrate installation completion","B":"To test, verify, and adjust all electrical equipment and systems to ensure safe, proper operation and code compliance before handover to operations**","C":"To measure future energy consumption","D":"To plan maintenance schedules","E":"To estimate equipment life"},"answer":"B","answer_text":"To test, verify, and adjust all electrical equipment and systems to ensure safe, proper operation and code compliance before handover to operations","rationale":"Commissioning includes comprehensive testing of all circuits, protective devices, grounding, equipment operation, and emergency systems. Deficiencies are corrected before the system is placed in service. Documentation of all commissioning tests is maintained. LADWP commissioning ensures customer systems are safe and reliable from day one."},{"id":118,"question":"What is the purpose of electrical system documentation?","options":{"A":"To create paperwork","B":"To provide detailed records of system design, installation, testing, and modifications that allow technicians to understand, maintain, and troubleshoot systems effectively","C":"To save on energy costs","D":"To measure performance","E":"To predict equipment failure Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"To provide detailed records of system design, installation, testing, and modifications that allow technicians to understand, maintain, and troubleshoot systems effectively","rationale":"Complete documentation including diagrams, test records, maintenance logs, and modification records is essential for safe and efÏcient system operation. Future technicians rely on documentation to understand system design and troubleshoot problems. LADWP maintains comprehensive documentation for all systems in its territory."},{"id":119,"question":"What is the relationship between power, voltage, and current for resistive loads?","options":{"A":"Power = Voltage + Current","B":"Power = Voltage × Current","C":"Power = Voltage ÷ Current","D":"Power = Current ÷ Voltage","E":"There is no relationship"},"answer":"B","answer_text":"Power = Voltage × Current","rationale":"The fundamental power equation P = V × I (power equals voltage times current) applies to all loads. For three-phase power, P = √3 × V × I × power factor. Understanding this relationship is essential for calculating power consumption, sizing circuits, and understanding load requirements. LADWP uses this relationship in all system calculations."},{"id":120,"question":"What is the purpose of \"pulling tension\" monitoring during cable installation?","options":{"A":"To make installation faster Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"To prevent excessive mechanical stress on conductors that could damage insulation or break the cable, ensuring cable reliability","C":"To measure cable strength","D":"To predict cable life","E":"To increase installation cost"},"answer":"B","answer_text":"To prevent excessive mechanical stress on conductors that could damage insulation or break the cable, ensuring cable reliability","rationale":"Cables have maximum allowable pulling tension based on diameter and construction. Exceeding this tension can damage internal conductors or insulation, creating weak points prone to failure. Technicians monitor tension with dynamometers and adjust pulling techniques. LADWP cable installation procedures limit pulling tension to manufacturer specifications."},{"id":121,"question":"What is the main difference between NM cable and UF cable?","options":{"A":"They are identical","B":"UF cable is listed for wet locations and direct burial where permitted, while NM cable is generally limited to dry locations","C":"NM cable cannot carry current","D":"UF cable cannot carry current","E":"They differ only in conductor gauge"},"answer":"B","answer_text":"UF cable is listed for wet locations and direct burial where permitted, while NM cable is generally limited to dry locations","rationale":"UF cable is listed for wet locations and can be used for direct burial where permitted by its listing and code. NM cable is generally intended for dry locations and is not a direct-burial cable."},{"id":122,"question":"What is the primary purpose of a service disconnect?","options":{"A":"For appearance","B":"To provide a means to disconnect the premises wiring from the supply and permit safe servicing","C":"To reduce electricity costs","D":"To increase system efficiency","E":"To prevent voltage spikes"},"answer":"B","answer_text":"To provide a means to disconnect the premises wiring from the supply and permit safe servicing","rationale":"A service disconnect provides a means to disconnect the premises wiring from the supply. The exact disconnecting means and whether it provides a visible indication of the open condition depend on the equipment and applicable code requirements."},{"id":123,"question":"What is the function of a \"jumper\" wire in electrical work?","options":{"A":"A wire used to measure distance","B":"A temporary or permanent conductor used to establish a connection, bypass a component, or equalize potential between points**","C":"A type of cable**","D":"A measurement device","E":"A safety equipment Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"A temporary or permanent conductor used to establish a connection, bypass a component, or equalize potential between points","rationale":"Jumper wires connect isolated points, bypass damaged sections, or carry current around defective components. Bonding jumpers equalize potential between metal parts. Jumpers must be properly sized for the current they carry and must be suitably rated. LADWP uses jumpers for temporary connections during installation and maintenance."},{"id":124,"question":"What is the purpose of \"backing out\" a screw terminal when installing conductors?","options":{"A":"To loosen all terminals","B":"To open the screw slightly before inserting the conductor, allowing the conductor to seat properly before final tightening","C":"To remove the terminal","D":"To prevent overtightening","E":"To measure terminal size"},"answer":"B","answer_text":"To open the screw slightly before inserting the conductor, allowing the conductor to seat properly before final tightening","rationale":"Backing out (opening) screw terminals slightly creates space for conductor insertion. This prevents damaging the insulation during installation and ensures proper seating. After conductor insertion, the screw is tightened securely but not excessively. LADWP installation procedures require proper screw terminal technique for all connections."},{"id":125,"question":"What is the difference between \"step potential\" and \"touch potential\" in electrical safety? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"They are the same thing","B":"Step potential is voltage between feet when standing near a fault; touch potential is voltage between hand and feet when touching fault point**","C":"Only step potential is dangerous","D":"Only touch potential is dangerous","E":"They only apply to DC current"},"answer":"B","answer_text":"Step potential is voltage between feet when standing near a fault; touch potential is voltage between hand and feet when touching fault point","rationale":"During a ground fault near underground cables, dangerous voltage gradients develop in the ground. Step potential occurs between feet steps apart; touch potential occurs when contacting energized equipment. Both are dangerous. LADWP fencing around underground cable work areas prevents personnel from entering zones where step or touch potentials exist."},{"id":126,"question":"What is the purpose of electrical safety training and certification?","options":{"A":"To create unnecessary paperwork","B":"To ensure workers understand hazards, safe work practices, and proper use of equipment, reducing injuries and legal liability","C":"To reduce hiring","D":"To increase costs","E":"To limit work activities"},"answer":"B","answer_text":"To ensure workers understand hazards, safe work practices, and proper use of equipment, reducing injuries and legal liability","rationale":"Safety training and certification programs ensure workers can identify hazards, apply safe work procedures, use protective equipment correctly, and Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) respond to emergencies. Trained workers are more confident, efÏcient, and less likely to cause injuries to themselves or others. LADWP mandates safety training for all electrical workers."},{"id":127,"question":"What is the function of a \"thermal overload relay\"?","options":{"A":"To increase motor speed","B":"To protect motors from overheating due to sustained overload by opening the control circuit before motor insulation is damaged**","C":"To measure motor temperature","D":"To measure motor speed","E":"To increase motor torque"},"answer":"B","answer_text":"To protect motors from overheating due to sustained overload by opening the control circuit before motor insulation is damaged","rationale":"Thermal overload relays respond to excessive current by heating a bimetal element that deflects and opens a contact. This breaks the motor control circuit, stopping the motor before dangerous overheating occurs. Overload protection is essential for motor longevity and safety. LADWP motor starters include properly sized overload relays."},{"id":128,"question":"What is the purpose of a \"soft starter\"?","options":{"A":"To make starting easier","B":"To gradually ramp voltage and current during motor starting, reducing inrush current and mechanical stress on equipment while saving energy**","C":"To start motors more slowly","D":"To reduce motor power Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"To eliminate motor vibration"},"answer":"B","answer_text":"To gradually ramp voltage and current during motor starting, reducing inrush current and mechanical stress on equipment while saving energy","rationale":"Soft starters use semiconductor technology to gradually increase voltage during startup, reducing inrush current to 2-5 times normal running current (versus 5-8 times with across-the-line starters). This reduces stress on mechanical components, dimming of lights, and electrical losses. LADWP uses soft starters on large motors."},{"id":129,"question":"What is the purpose of a Variable Frequency Drive (VFD)?","options":{"A":"To change motor color","B":"To convert fixed-frequency AC power to variable frequency, allowing motors to operate at different speeds based on load requirements, improving efÏciency and control**","C":"To increase motor power","D":"To measure motor frequency","E":"To disconnect motors"},"answer":"B","answer_text":"To convert fixed-frequency AC power to variable frequency, allowing motors to operate at different speeds based on load requirements, improving efÏciency and control","rationale":"VFDs use power electronics to adjust both frequency and voltage, allowing motors to run at reduced speed when full power is not needed. This saves energy, reduces mechanical wear, and improves process control. VFDs are standard equipment on LADWP pump motors and variable-load applications."},{"id":130,"question":"Which voltage level is generally treated as a threshold for additional shock-protection requirements in OSHA electrical safe-work rules?","options":{"A":"1V AC","B":"50V AC or DC and above","C":"500V AC only","D":"Only utility transmission voltage","E":"No voltage can present a shock hazard"},"answer":"B","answer_text":"50V AC or DC and above","rationale":"OSHA 1910.333 addresses exposed live parts at 50 volts or more. This threshold does not mean every exposure above 50V automatically causes serious injury; injury depends on current, path, duration, conditions, and other factors."},{"id":131,"question":"What is a \"bonding jumper\" and why is it required?","options":{"A":"A decorative wire","B":"A conductor connecting non-current-carrying metal parts to the grounding system, ensuring all metal surfaces are at equal potential to prevent shock hazards**","C":"A temporary repair wire","D":"A protective fuse","E":"A circuit protection device"},"answer":"B","answer_text":"A conductor connecting non-current-carrying metal parts to the grounding system, ensuring all metal surfaces are at equal potential to prevent shock hazards Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Bonding jumpers connect equipment frames, conduit, cable armor, and other conductive parts to the main grounding system. This ensures no dangerous voltage difference exists between metal surfaces, protecting personnel from shock. Bonding jumpers must be properly sized and securely terminated. LADWP requires bonding on all installations."},{"id":132,"question":"What is the \"fault clearing time\" and why does it matter?","options":{"A":"The speed of installing equipment","B":"The time from fault detection until protective device opens the circuit; faster clearing reduces energy dissipation and arc flash intensity","C":"The time between maintenance","D":"The speed of repairs","E":"The duration of power outages"},"answer":"B","answer_text":"The time from fault detection until protective device opens the circuit; faster clearing reduces energy dissipation and arc flash intensity","rationale":"Faster fault clearing means less energy is released as heat and arc. This reduces arc flash danger and equipment damage. Breaker selection and coordination are designed to clear faults as quickly as possible. LADWP system protection is coordinated to clear faults in less than 100 milliseconds where practical."},{"id":133,"question":"What is the proper way to handle a burned-out light bulb?","options":{"A":"Throw it in regular trash","B":"Dispose of it according to local regulations; fluorescent bulbs require special handling due to mercury content Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","C":"Pour water on it","D":"Burn it","E":"Bury it"},"answer":"B","answer_text":"Dispose of it according to local regulations; fluorescent bulbs require special handling due to mercury content","rationale":"CFL and fluorescent bulbs contain mercury requiring special disposal. Even LED bulbs may contain recyclable materials. Regular incandescent bulbs can go in trash in most areas, but fluorescent waste is hazardous. LADWP facilities maintain proper disposal containers for lighting waste and encourages employee participation in responsible disposal."},{"id":134,"question":"What is the purpose of conduit-fill calculations?","options":{"A":"To determine the weight of conduit","B":"To ensure conductors fit within the permitted conduit area and can be installed without violating fill requirements","C":"To measure conduit length","D":"To calculate installation cost","E":"To predict equipment failure"},"answer":"B","answer_text":"To ensure conductors fit within the permitted conduit area and can be installed without violating fill requirements","rationale":"NEC Chapter 9, Table 1 provides general conduit-fill limits: 53% for one conductor, 31% for two conductors, and 40% for more than two conductors, subject to the applicable rules and exceptions."},{"id":135,"question":"What is an \"expedient ground\" and when is it used?","options":{"A":"A permanent grounding system","B":"A temporary, readily accessible grounding connection used during emergency de-energization when normal grounding is not available**","C":"A ground rod installation","D":"A bonding strap","E":"A surge protector"},"answer":"B","answer_text":"A temporary, readily accessible grounding connection used during emergency de-energization when normal grounding is not available","rationale":"Expedient grounds allow quick de-energization of cables or equipment in emergencies by creating a low-resistance path to ground. These pre- installed, labeled connections reduce response time during accidents. LADWP underground cable systems include strategically located expedient ground points for emergency de-energization."},{"id":136,"question":"What is the purpose of \"cable tracing\" in underground systems?","options":{"A":"To follow cables for fun","B":"To locate exact positions of buried cables and prevent accidental damage during excavation or construction work**","C":"To measure cable length","D":"To test cable continuity","E":"To identify insulation problems Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"To locate exact positions of buried cables and prevent accidental damage during excavation or construction work","rationale":"Underground cables must be accurately located before any excavation. Cable tracing uses specialized equipment that detects signals in buried cables or traces physical markers. Proper locating prevents accidents that could damage cables, interrupt service, or injure workers. LADWP cable locating is required before any third-party excavation in its territory."},{"id":137,"question":"What is the function of a \"cable terminator\" or \"end seal\"?","options":{"A":"To mark cable ends","B":"To seal cable ends preventing moisture and corrosion from entering the cable, which would damage insulation and create faults**","C":"To measure cable length","D":"To connect cables together","E":"To increase cable strength"},"answer":"B","answer_text":"To seal cable ends preventing moisture and corrosion from entering the cable, which would damage insulation and create faults","rationale":"Open cable ends expose inner conductors to moisture and oxidation. Terminators (epoxy or mechanical seals) create waterproof seals that prevent degradation. Proper termination is essential for cable longevity. LADWP uses qualified cable termination techniques on all cables, especially on terminations in vaults or at splice points."},{"id":138,"question":"What is the purpose of cable thumping or surge testing?","options":{"A":"To make noise in cables","B":"To apply controlled test pulses to help locate insulation faults or cable failures; the test must be performed with procedures appropriate to the cable and test method","C":"To measure only cable length","D":"To strengthen cables","E":"To clean cables"},"answer":"B","answer_text":"To apply controlled test pulses to help locate insulation faults or cable failures; the test must be performed with procedures appropriate to the cable and test method","rationale":"Cable fault-location and surge-testing methods use controlled electrical pulses to identify or locate insulation faults. Such testing can stress weak insulation, so it should not be described as inherently damage-free."},{"id":139,"question":"What is the meaning of \"back-feeding\" in electrical systems?","options":{"A":"Returning power to a battery","B":"Unintended supply of power flowing back into an electrical system, transformer, or utility lines in the wrong direction**","C":"A type of wire connection","D":"Motor starting method","E":"A protection device"},"answer":"B","answer_text":"Unintended supply of power flowing back into an electrical system, transformer, or utility lines in the wrong direction","rationale":"Back-feeding occurs when generators, solar panels, or other power sources in a building supply power to utility lines when the utility is de-energized. This creates dangerous voltage on lines workers believe are safe. Anti-back-feed devices are required. LADWP customers with backup generators must have automatic transfer switches to prevent back-feeding. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":140,"question":"What is the \"ampere-turn\" in transformer design?","options":{"A":"The current flowing through a transformer","B":"The product of current and number of winding turns, a measure of magnetizing force in transformer cores**","C":"The voltage in a transformer","D":"A type of relay","E":"A measurement of transformer efÏciency"},"answer":"B","answer_text":"The product of current and number of winding turns, a measure of magnetizing force in transformer cores","rationale":"Ampere-turns (N × I) create the magnetic force that magnetizes the transformer core. The primary winding's ampere-turns must balance the secondary winding's ampere-turns for proper transformer operation. This concept is fundamental to transformer theory and design. LADWP transformer specifications include ampere-turn ratings."},{"id":141,"question":"What is a \"deadman switch\" or \"dead-man's switch\"?","options":{"A":"A switch that never works","B":"A safety switch that automatically de-energizes equipment if the operator releases it (stops holding it), preventing continued operation if the operator is incapacitated**","C":"A switch for dead circuits","D":"A broken switch","E":"A testing device Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"A safety switch that automatically de-energizes equipment if the operator releases it (stops holding it), preventing continued operation if the operator is incapacitated","rationale":"Dead-man switches on power tools, cranes, and portable equipment require continuous operator contact to stay energized. Release immediately stops equipment, preventing injury if the operator falls or becomes incapacitated. This is essential safety equipment on LADWP mobile electrical equipment."},{"id":142,"question":"What is the purpose of \"cable splicing\" in underground systems?","options":{"A":"To join cables end-to-end**","B":"To join two cables end-to-end while maintaining electrical continuity, mechanical strength, and insulation integrity in situations where new cable cannot be installed","C":"To replace damaged cable","D":"To measure cable length","E":"To test cable quality"},"answer":"B","answer_text":"To join two cables end-to-end while maintaining electrical continuity, mechanical strength, and insulation integrity in situations where new cable cannot be installed","rationale":"Cable splices connect existing cables when replacement is not practical. Cold shrink, heat shrink, and epoxy splicing methods are used. Splices must pass high-voltage testing and must be installed only by qualified technicians in accessible locations. LADWP allows splices in vaults only; direct burial splices are not permitted."},{"id":143,"question":"What does \"normalized\" mean in electrical terms?","options":{"A":"Making something normal Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"Returned to rated voltage and current levels after disturbances or overcurrent events**","C":"Testing equipment","D":"Checking calibration","E":"A type of circuit"},"answer":"B","answer_text":"Returned to rated voltage and current levels after disturbances or overcurrent events","rationale":"After a fault or disturbance, the power system experiences transients. \"Normalized\" means the system has stabilized and returned to normal operating conditions. Monitoring this return helps identify system problems. LADWP supervisory systems monitor for system normalization after disturbances."},{"id":144,"question":"What is the purpose of electrical system \"redundancy\"?","options":{"A":"To increase cost","B":"To provide backup power paths or equipment so that loss of one element does not cause complete system failure, improving reliability","C":"To complicate operations","D":"To reduce efÏciency","E":"To save space"},"answer":"B","answer_text":"To provide backup power paths or equipment so that loss of one element does not cause complete system failure, improving reliability","rationale":"Redundant systems (two power sources, two transformers, alternate feeders) ensure service continuity if one element fails. Redundancy is expensive but justified for critical loads. LADWP downtown networks include significant redundancy; residential areas have less due to cost considerations and lower criticality. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":145,"question":"What is the function of a \"static transfer switch\"?","options":{"A":"A switch that never moves","B":"An electronic switch that transfers loads between power sources in milliseconds without power interruption, enabling seamless switchover to backup power**","C":"A manual disconnect","D":"A circuit breaker","E":"A voltage regulator"},"answer":"B","answer_text":"An electronic switch that transfers loads between power sources in milliseconds without power interruption, enabling seamless switchover to backup power","rationale":"Static transfer switches use semiconductor switches to rapidly transfer between primary and backup power supplies. Transfer occurs in milliseconds, fast enough that sensitive equipment and servers continue operating uninterrupted. These are essential for high-reliability systems serving data centers and hospitals that LADWP serves."},{"id":146,"question":"What is \"thermal imaging\" used for in electrical maintenance?","options":{"A":"To take pretty pictures","B":"To detect temperature differences indicating loose connections, overloaded components, or equipment failures before they cause problems**","C":"To measure room temperature","D":"To predict weather","E":"To plan air conditioning needs Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"To detect temperature differences indicating loose connections, overloaded components, or equipment failures before they cause problems","rationale":"Thermal imaging detects hot spots caused by poor connections (high resistance), excessive current, or equipment failures. Higher-than-normal temperatures warn of problems before equipment fails catastrophically. LADWP uses thermography as a predictive maintenance tool on transformers, switchgear, and cable systems."},{"id":147,"question":"What is the purpose of \"retard coils\" in motor starters?","options":{"A":"To slow motor rotation","B":"To limit inrush current during motor starting by introducing resistance or inductance, protecting the power system from voltage sags**","C":"To measure motor speed","D":"To increase motor torque","E":"To improve motor efÏciency"},"answer":"B","answer_text":"To limit inrush current during motor starting by introducing resistance or inductance, protecting the power system from voltage sags","rationale":"Retard coils (reactor or impedance) inserted in series during starting limit peak inrush current. This reduces stress on the power system and prevents voltage sags that affect other customers. After startup, the retard coil is bypassed. LADWP sometimes requires starting reactors on large motors to limit system impact."},{"id":148,"question":"What is the function of a \"cable test lead\" or \"test cable\"? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"For connecting equipment during testing**","B":"A heavy-duty insulated flexible conductor used to apply test voltage and current during electrical testing, rated for the testing environment","C":"A wire used for connections","D":"A measuring device","E":"A protective ground"},"answer":"B","answer_text":"A heavy-duty insulated flexible conductor used to apply test voltage and current during electrical testing, rated for the testing environment","rationale":"Test leads carry high test voltages and currents during megger, insulation, and function testing. They must have appropriate insulation ratings and mechanical durability. Damaged test leads can cause accidents. LADWP test leads are regularly inspected and replaced when necessary."},{"id":149,"question":"What is \"power quality\" and why does it matter?","options":{"A":"The loudness of electrical hum","B":"Steady voltage, minimal harmonics, and proper frequency—poor quality causes equipment malfunction, overheating, and reduced efÏciency","C":"The color of electrical components","D":"The speed of power delivery","E":"The cost of electricity"},"answer":"B","answer_text":"Steady voltage, minimal harmonics, and proper frequency—poor quality causes equipment malfunction, overheating, and reduced efÏciency","rationale":"Good power quality means voltage stays within ±10% of nominal, frequency stays at 60 Hz, and harmonic distortion is minimized. Poor power quality Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) damages equipment, causes computer crashes, and wastes energy. LADWP monitors power quality and works to maintain high standards on its system."},{"id":150,"question":"What is the purpose of \"cable jacket removal\" before splicing?","options":{"A":"To weaken the cable","B":"To expose inner insulation that will be properly sealed in the splice connection, preventing moisture entry","C":"To shorten the cable","D":"To measure wire size","E":"To weaken the splice"},"answer":"B","answer_text":"To expose inner insulation that will be properly sealed in the splice connection, preventing moisture entry","rationale":"Removing the cable jacket exposes the conductors and inner insulation. The splice covers this section completely and seals it against moisture. Proper jacket removal (without damaging inner insulation) and covering is critical for splice reliability. LADWP technicians receive training in proper cable preparation for splicing."},{"id":151,"question":"What does \"symmetrical\" mean regarding fault currents?","options":{"A":"The same on both sides of the circuit","B":"The RMS value calculated without accounting for the DC offset, used for protective device design and sizing**","C":"Current that never changes","D":"Equal voltage and current Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"Current flowing in one direction only"},"answer":"B","answer_text":"The RMS value calculated without accounting for the DC offset, used for protective device sizing","rationale":"Symmetrical fault current is the AC component of current during a short circuit, excluding the initial DC offset. This is the standard value used for equipment ratings and protective device selection per IEEE standards. Actual initial current may be higher due to DC offset. LADWP equipment ratings are based on symmetrical current values."},{"id":152,"question":"What is the purpose of \"ballast\" in lighting circuits?","options":{"A":"To make fixtures heavier","B":"To regulate current and voltage to fluorescent or HID lamps, providing proper starting voltage and limiting run current to rated values","C":"To measure light output","D":"To change light color","E":"To reduce electricity cost"},"answer":"B","answer_text":"To regulate current and voltage to fluorescent or HID lamps, providing proper starting voltage and limiting run current to rated values","rationale":"Ballasts provide the high voltage needed to strike an arc in fluorescent or HID lamps, then limit current to safe levels during operation. Without ballasts, these lamps would draw excessive current and burn out. Modern electronic ballasts are more efÏcient than magnetic ballasts. LADWP street lighting includes appropriate ballasts for each lamp type."},{"id":153,"question":"What is the function of a \"contactor coil\"? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"To conduct electricity","B":"To create a magnetic field when energized that actuates the contactor contacts, opening or closing the power circuit","C":"To measure voltage","D":"To store energy","E":"To regulate temperature"},"answer":"B","answer_text":"To create a magnetic field when energized that actuates the contactor contacts, opening or closing the power circuit","rationale":"Contactor coils are electromagnets that pull contacts together when low-voltage control signals energize them. De-energizing the coil allows springs to open the contacts. Coils must be properly sized for the control voltage and must be protected against overvoltage. LADWP motor and equipment controls use properly specified contactor coils."},{"id":154,"question":"What is the meaning of \"inservice testing\" for electrical equipment?","options":{"A":"Testing during business hours only","B":"Testing of equipment while it remains energized and operating in its normal application, used for predictive maintenance","C":"Testing at a service center","D":"Testing before installation","E":"Testing after failure"},"answer":"B","answer_text":"Testing of equipment while it remains energized and operating in its normal application, used for predictive maintenance","rationale":"Inservice testing (like thermal imaging, vibration analysis, or partial discharge testing) on operating equipment provides early warning of developing problems without interrupting service. This allows planning maintenance during Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) scheduled outages. LADWP uses inservice testing as part of its preventive maintenance strategy."},{"id":155,"question":"What is the purpose of \"harmonic filters\" in electrical systems?","options":{"A":"To block all harmonics","B":"To reduce harmonic current by presenting low impedance paths at harmonic frequencies, preventing harmonics from propagating to the utility system","C":"To increase harmonics","D":"To measure harmonics","E":"To eliminate power factor penalties"},"answer":"B","answer_text":"To reduce harmonic current by presenting low impedance paths at harmonic frequencies, preventing harmonics from propagating to the utility system","rationale":"Harmonic filters (capacitors and reactors) absorb harmonic currents at specific frequencies. This prevents these currents from flowing into the utility system where they can damage other customers' equipment. LADWP sometimes requires harmonic filters on large customers with significant harmonic loads."},{"id":156,"question":"What is \"ground resistance testing\" and why is it performed?","options":{"A":"To test how electricity flows through ground","B":"To measure the resistance of grounding electrodes, ensuring they can safely carry fault current to earth","C":"To predict ground failures","D":"To measure soil conductivity only Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"To locate ground rods"},"answer":"B","answer_text":"To measure the resistance of grounding electrodes, ensuring they can safely carry fault current to earth","rationale":"Ground resistance testing (fall-of-potential method) measures how effectively grounding electrodes conduct current to earth. Low resistance (under 25 ohms) ensures rapid dissipation of fault currents. High resistance indicates poor electrode performance. LADWP verifies ground resistance on all new installations and at periodic intervals."},{"id":157,"question":"What is the purpose of insulation coordination in an electrical system?","options":{"A":"To match insulation colors","B":"To coordinate insulation strength and protective devices so equipment can withstand expected overvoltages and protection operates appropriately","C":"To improve aesthetics","D":"To reduce insulation thickness without analysis","E":"To lower costs regardless of safety"},"answer":"B","answer_text":"To coordinate insulation strength and protective devices so equipment can withstand expected overvoltages and protection operates appropriately","rationale":"Insulation coordination is the selection and coordination of insulation levels and protective measures in relation to expected overvoltages so equipment has adequate withstand capability and unnecessary insulation failures are avoided."},{"id":158,"question":"What is the function of a \"parallel cable system\"? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"To increase voltage","B":"To divide current among multiple cables for large loads, reducing conductor size and improving cooling by spreading current load","C":"To increase voltage drop","D":"To reduce equipment size","E":"To simplify installations"},"answer":"B","answer_text":"To divide current among multiple cables for large loads, reducing conductor size and improving cooling by spreading current load","rationale":"Large currents that would require huge single conductors can be split among multiple smaller cables run in parallel. This reduces cost and improves heat dissipation. Parallel cables must be selected and installed carefully to ensure equal current division and must be of identical type and length. LADWP uses parallel cables for main feeders and secondary distribution."},{"id":159,"question":"What is a \"cable equalizer\"?","options":{"A":"A device that makes noise","B":"A connection between parallel cables ensuring equal current distribution among them**","C":"A voltage regulator","D":"A circuit breaker","E":"A measurement tool"},"answer":"B","answer_text":"A connection between parallel cables ensuring equal current distribution among them","rationale":"Cable equalizers connect parallel cables at regular intervals (typically every 200 feet) to ensure current divides equally among all cables. Without equalizers, current may concentrate in one or two cables due to slightly different Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) impedances. Proper equalizer design and installation is critical for parallel cable systems."},{"id":160,"question":"What is the purpose of \"cable derating\"?","options":{"A":"To reduce cable strength","B":"To reduce the ampacity rating of cables when installed in conditions that reduce heat dissipation (bundles, trays, high ambient temperatures), preventing overheating","C":"To save money","D":"To slow current flow","E":"To increase voltage drop"},"answer":"B","answer_text":"To reduce the ampacity rating of cables when installed in conditions that reduce heat dissipation (bundles, trays, high ambient temperatures), preventing overheating","rationale":"Cables in bundles, cable trays, or buried in earth cannot dissipate heat as effectively as air-cooled cables. Derating factors from NEC tables reduce allowable ampacity to prevent overheating. Failure to apply proper derating factors causes insulation breakdown. LADWP load calculations include all applicable derating factors."},{"id":161,"question":"What is the function of \"pothead\" terminators on high-voltage cables?","options":{"A":"Decorative covers","B":"Sealed, stress-relieving terminations that contain cable shielding transitions and prevent moisture entry at the end of shielded high-voltage cables","C":"Voltage regulators Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","D":"Ground connections","E":"Safety switches"},"answer":"B","answer_text":"Sealed, stress-relieving terminations that contain cable shielding transitions and prevent moisture entry at the end of shielded high- voltage cables","rationale":"Pothead terminators provide sealed, weatherproof connections for shielded cables at switchgear entrances. They properly transition from shielded underground cable to equipment, controlling electric stress and preventing moisture entry. Failure of pothead seals allows moisture into cable insulation causing faults. LADWP high-voltage cable systems use proper pothead terminators."},{"id":162,"question":"What is the meaning of \"sectionalizing\" in electrical systems?","options":{"A":"Dividing a system into sections","B":"Dividing distribution systems into sections with isolating switches so that faults affect only one section while others remain energized","C":"Measuring system sections","D":"Counting sections"},"answer":"B","answer_text":"Dividing distribution systems into sections with isolating switches so that faults affect only one section while others remain energized","rationale":"Sectionalizing isolates system portions for maintenance or to limit outages from faults. With proper sectionalizing, a cable fault affects only customers on that section. Other customers continue receiving power. LADWP underground systems include sufÏcient sectionalization to minimize outage impacts."},{"id":163,"question":"Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) What is the purpose of \"reclosers\" on distribution lines?","options":{"A":"To close circuits tight**","B":"To automatically reclose distribution circuits after temporary faults clear, restoring service to most customers instantly while permanent faults trip the main feeder breaker","C":"To measure voltage","D":"To regulate voltage","E":"To prevent overload"},"answer":"B","answer_text":"To automatically reclose distribution circuits after temporary faults clear, restoring service to most customers instantly while permanent faults trip the main feeder breaker","rationale":"Reclosers detect overcurrent from a fault and open temporarily, allowing the arc to de-ionize. Then they reclose. If the fault is gone (temporary fault like a fallen branch), service is restored. If the fault remains, the recloser cycles and eventually locks out. This restores service quickly for temporary faults. LADWP uses reclosers on distribution feeders."},{"id":164,"question":"What is a \"distribution cutout\" used for?","options":{"A":"To decorate poles","B":"Mounted on poles, a cutout contains fuses protecting branch circuits and allows isolation of circuit sections for maintenance or protection during faults","C":"To connect wires","D":"To measure voltage","E":"To indicate phase Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"Mounted on poles, a cutout contains fuses protecting branch circuits and allows isolation of circuit sections for maintenance or protection during faults","rationale":"Cutouts are pole-mounted devices containing one or more fuses. When branch circuit faults occur, the fuse blows, isolating that circuit from the main feeder. Cutouts also allow easy circuit disconnection for maintenance. LADWP aerial distribution systems include numerous cutouts for protection and sectionalizing."},{"id":165,"question":"What does \"fault level\" mean in electrical systems?","options":{"A":"The height of ground level at a fault location","B":"The maximum short-circuit current the system can produce at a given location, used to size protective devices and equipment**","C":"The severity of a failure","D":"The location of faults","E":"The duration of a fault"},"answer":"B","answer_text":"The maximum short-circuit current the system can produce at a given location, used to size protective devices and equipment","rationale":"Fault level (short-circuit current capacity) varies throughout a system, being highest near large power sources (main feeder) and decreasing downstream. Equipment must be rated for the fault level at its location. LADWP calculates fault levels at key points to properly rate switchgear and protective devices."},{"id":166,"question":"What is \"fault contribution\" from distributed generation?","options":{"A":"Energy contributed by distributed generation Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"Additional short-circuit current from rooftop solar and other local power sources that affects protective device coordination and may require protection system redesign**","C":"Voltage contribution from generators","D":"Power factor improvement","E":"Energy storage capacity"},"answer":"B","answer_text":"Additional short-circuit current from rooftop solar and other local power sources that affects protective device coordination and may require protection system redesign","rationale":"Distributed solar, wind, and other local generation adds to short- circuit current during faults. This can exceed the fault current that existing protective devices were designed to handle, potentially causing nuisance tripping or equipment damage. LADWP coordinates protection when customers add distributed generation."},{"id":167,"question":"What is the purpose of \"utility coordination\" or \"protection coordination\"?","options":{"A":"Social interaction among utilities","B":"Ensuring protective devices operate in proper sequence so closer-in devices clear faults before upstream devices, isolating only affected sections","C":"Sharing equipment","D":"Measuring distances","E":"Planning meetings"},"answer":"B","answer_text":"Ensuring protective devices operate in proper sequence so closer-in devices clear faults before upstream devices, isolating only affected sections","rationale":"Coordination ensures that if a circuit breaker closest to a fault should operate first, it does, before upstream breakers trip and cause larger outages. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) Proper coordination requires careful breaker settings and proper time delays. Poor coordination causes unnecessary outages. LADWP protection systems are carefully coordinated."},{"id":168,"question":"What is a \"time-current curve\" (TCC) for protective devices?","options":{"A":"A decorative graph","B":"A graph showing the relationship between current magnitude and the time required for a protective device to open, used for coordination analysis","C":"A voltage graph","D":"A temperature curve","E":"A frequency chart"},"answer":"B","answer_text":"A graph showing the relationship between current magnitude and the time required for a protective device to open, used for coordination analysis","rationale":"TCC curves show how quickly protective devices respond to different overcurrents. By plotting curves for all devices, engineers can verify that upstream devices are slower than downstream devices at each fault level, ensuring proper coordination. LADWP uses TCC curve analysis for all protection system design."},{"id":169,"question":"What is the meaning of \"selective coordination\"?","options":{"A":"Choosing equipment by preference","B":"Protective device arrangement where only the device nearest the fault operates, preventing unnecessary outages of healthy circuits**","C":"Selecting circuit breakers","D":"Choosing cable types Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"Selecting wire sizes"},"answer":"B","answer_text":"Protective device arrangement where only the device nearest the fault operates, preventing unnecessary outages of healthy circuits","rationale":"Selective coordination isolates only faulted sections, keeping the rest of the system energized. This minimizes customer outages and is required for emergency systems, hospitals, and critical facilities per NEC 700. LADWP provides selective coordination where required by code and where economically justified."},{"id":170,"question":"What is an \"arc extinguishing medium\" in circuit breakers?","options":{"A":"A sound that stops arcs","B":"The substance (SF6 gas, oil, or vacuum) in which the arc extinguishes when contacts open, cooling the arc and preventing current flow","C":"A material that causes arcs","D":"A type of switch","E":"A measurement tool"},"answer":"B","answer_text":"The substance (SF6 gas, oil, or vacuum) in which the arc extinguishes when contacts open, cooling the arc and preventing current flow","rationale":"Different breaker types use different arc extinguishing media: oil absorbs arc energy; SF6 gas (sulfur hexafluoride) is excellent but has environmental concerns; vacuum has best arc extinguishing and minimal equipment damage. The medium chosen affects breaker size, cost, and environmental impact. LADWP uses appropriate arc media for each application."},{"id":171,"question":"What is the purpose of \"surge arrestors\" on distribution systems? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"To arrest people on poles","B":"To provide a safe path for lightning and switching transient overvoltages to ground, protecting equipment from voltage surges**","C":"To measure voltage","D":"To regulate voltage","E":"To increase voltage**"},"answer":"B","answer_text":"To provide a safe path for lightning and switching transient overvoltages to ground, protecting equipment from voltage surges","rationale":"Surge arrestors (also called surge protectors) on distribution poles divert high-voltage surges to ground, protecting customer equipment and pole- mounted transformers. Without arrestors, lightning and switching surges would damage transformers and customer equipment. LADWP surge arrestors on all distribution lines."},{"id":172,"question":"What is a \"disconnect blade\" and its function?","options":{"A":"A decorative part of the switch","B":"A visible movable conductor that physically separates from contacts when the disconnect opens, providing visible confirmation of de-energization","C":"A cutting tool","D":"A measuring device","E":"A protective fuse"},"answer":"B","answer_text":"A visible movable conductor that physically separates from contacts when the disconnect opens, providing visible confirmation of de-energization","rationale":"Knife switch blades move away from stationary contacts when the switch opens, allowing visual verification that circuits are de-energized. This visible Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) break is critical for safety. Modern disconnect switches maintain this visual break principle. LADWP emphasizes disconnect switches with visible blades for safety- critical work."},{"id":173,"question":"What is the purpose of \"cable termination kits\"?","options":{"A":"To make terminations prettier","B":"Kits containing all materials needed for proper, safe, code-compliant cable termination including seals, insulation, and strain relief**","C":"To reduce cable length","D":"To measure cable","E":"To test cable continuity"},"answer":"B","answer_text":"Kits containing all materials needed for proper, safe, code-compliant cable termination including seals, insulation, and strain relief","rationale":"Cable termination kits simplify the process of properly terminating cables. Kits ensure correct materials are used and steps are followed. Professional- grade kits from manufacturers meet all standards. Using proper kits is easier and safer than sourcing components separately. LADWP requires use of proper termination kits for all cable work."},{"id":174,"question":"What does \"short circuit rating\" or \"interrupting rating\" mean?","options":{"A":"The maximum voltage the device can handle","B":"The maximum short-circuit current the protective device can safely interrupt without damage, essential for proper equipment selection**","C":"The normal rated current","D":"The physical size of the device Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"The temperature rating"},"answer":"B","answer_text":"The maximum short-circuit current the protective device can safely interrupt without damage, essential for proper equipment selection","rationale":"Every protective device has an interrupting rating (measured in amperes or kA - kiloamperes). If the fault current exceeds this rating, the device cannot safely interrupt it and may explode or allow continued current flow. Devices must be rated for the maximum fault current at their location. LADWP ensures all equipment meets or exceeds system fault levels."},{"id":175,"question":"What is the purpose of electrical system \"load shedding\"?","options":{"A":"To remove equipment","B":"To automatically disconnect loads in sequence during emergencies, reducing total demand to keep the system stable and prevent blackouts","C":"To reduce electricity cost","D":"To increase voltage","E":"To measure load**"},"answer":"B","answer_text":"To automatically disconnect loads in sequence during emergencies, reducing total demand to keep the system stable and prevent blackouts","rationale":"When system frequency drops during generation shortages, load shedding automatically disconnects non-critical loads to reduce total demand and stabilize frequency. This controlled load shedding prevents cascading failures that would cause widespread blackouts. LADWP systems include load shedding schemes for emergencies."},{"id":176,"question":"Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) What is a \"transfer switch\" and its primary application?","options":{"A":"A light switch","B":"A switch that transfers loads between two power sources (utility and backup), essential for generators, dual feeds, and UPS systems**","C":"A type of disconnect","D":"A circuit breaker","E":"A safety switch"},"answer":"B","answer_text":"A switch that transfers loads between two power sources (utility and backup), essential for generators, dual feeds, and UPS systems","rationale":"Transfer switches connect loads to either utility or backup power. Manual transfer switches require operator action; automatic transfer switches (ATS) sense utility failure and automatically switch to backup power. This is essential for emergency systems, hospitals, and critical facilities. LADWP customers with generators require proper transfer switches."},{"id":177,"question":"What is \"cable pulling lubricant\" and why is it used?","options":{"A":"To clean cables","B":"To reduce friction between cables and conduit during installation, preventing insulation damage and reducing pulling force required**","C":"To waterproof cables","D":"To increase cable strength","E":"To improve conductivity"},"answer":"B","answer_text":"To reduce friction between cables and conduit during installation, preventing insulation damage and reducing pulling force required Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Cable pulling lubricants reduce friction between outer cable jacket and conduit walls. This allows higher pulling force to be applied without exceeding maximum cable tension, enabling longer cable runs in conduit. Lubricants must be compatible with cable insulation materials. LADWP specifies proper lubricants for large cable installations."},{"id":178,"question":"What does the term 'service level' mean when used in an electrical service context?","options":{"A":"Determining who gets better electrical service","B":"A defined level of service performance or reliability, such as response or restoration targets, rather than a universal NEC Level 1/2/3 electrical classification","C":"Organizing NEC code sections","D":"Measuring voltage levels","E":"Categorizing customers by income"},"answer":"B","answer_text":"A defined level of service performance or reliability, such as response or restoration targets, rather than a universal NEC Level 1/2/3 electrical classification","rationale":"The original question's 'Level 1, Level 2, Level 3' electrical-code classification was not a reliable general NEC concept. Service-level terminology can instead refer to defined service performance or reliability expectations."},{"id":179,"question":"What is a \"megohmmeter\" reading and what does it indicate?","options":{"A":"The power consumption","B":"A high resistance value (typically in megohms) between conductors and ground, indic
