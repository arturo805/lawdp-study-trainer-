<script>
const questions = [{"id":1,"question":"What is the primary purpose of grounding in an electrical system?","options":{"A":"To increase the efÏciency of power transmission","B":"To provide a safe path for fault currents and protect personnel from electrical shock","C":"To reduce the cost of electrical installation","D":"To increase the voltage output of the system","E":"To prevent the use of circuit breakers"},"answer":"B","answer_text":"To provide a safe path for fault currents and protect personnel from electrical shock","rationale":"Grounding creates a low-resistance path for abnormal currents to return to the earth, preventing dangerous voltage buildup on equipment. This protects workers from electrocution hazards and allows overcurrent devices to Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) operate quickly during fault conditions, which is fundamental to electrical safety per NEC standards."},{"id":2,"question":"Which of the following best describes the function of a circuit breaker?","options":{"A":"To store electrical energy in the circuit","B":"To regulate the voltage in a circuit","C":"To automatically interrupt current flow when overcurrent or short circuit conditions occur","D":"To increase the amperage in a circuit","E":"To convert AC current to DC current"},"answer":"C","answer_text":"To automatically interrupt current flow when overcurrent or short circuit conditions occur","rationale":"Circuit breakers are protective devices that open automatically when they detect excessive current flow beyond their rated capacity. This interruption prevents overheating of wires, equipment damage, and fire hazards. Unlike fuses, circuit breakers can be reset and reused."},{"id":3,"question":"What does NEC stand for?","options":{"A":"National Electrical Code","B":"National Energy Commission","C":"New Equipment Configuration","D":"National Electrical Contractors","E":"Network Engineering Certification"},"answer":"A","answer_text":"National Electrical Code Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/","rationale":"The NEC is the primary standard setting forth requirements for the safe installation of electrical wiring and equipment in the United States. LADWP work must comply with current NEC standards, which are updated every three years. Knowledge of NEC requirements is essential for all electrical craft positions."},{"id":4,"question":"Which conductor material is most commonly used in residential and commercial electrical installations?","options":{"A":"Aluminum","B":"Copper","C":"Steel","D":"Silver","E":"Gold"},"answer":"B","answer_text":"Copper","rationale":"Copper offers the best combination of electrical conductivity, corrosion resistance, mechanical strength, and cost-effectiveness for most electrical applications. While aluminum is sometimes used for larger conductors, copper remains the standard choice for LADWP installations due to its superior properties and reliability."},{"id":5,"question":"What is the standard voltage for residential service in the United States?","options":{"A":"120/240 volts single-phase","B":"277/480 volts three-phase","C":"120 volts DC","D":"208 volts single-phase Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"600 volts AC"},"answer":"A","answer_text":"120/240 volts single-phase","rationale":"Typical residential service in North America is 120/240 volts, single- phase, which provides 120 volts for lighting and general-purpose circuits and 240 volts for large appliances. This standard allows for efÏcient power distribution to individual homes and is the baseline for residential electrical codes."},{"id":6,"question":"What is the relationship between voltage, current, and resistance in Ohm's Law?","options":{"A":"Voltage = Current × Resistance","B":"Voltage = Current ÷ Resistance","C":"Voltage = Resistance ÷ Current","D":"Voltage = Current + Resistance","E":"Voltage = Current - Resistance"},"answer":"A","answer_text":"Voltage = Current × Resistance","rationale":"Ohm's Law (V = I × R) is fundamental to electrical theory and troubleshooting. Understanding this relationship allows technicians to calculate unknown values when two are known, which is essential for circuit analysis, sizing conductors, and diagnosing electrical problems on LADWP equipment."},{"id":7,"question":"What is the purpose of a service entrance panel?","options":{"A":"To decorate the exterior of a building","B":"To distribute power from the utility line to all branch circuits in a building","C":"To store electrical tools and materials Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","D":"To measure water consumption","E":"To regulate building temperature"},"answer":"B","answer_text":"To distribute power from the utility line to all branch circuits in a building","rationale":"The service entrance panel is the main disconnect point and distribution center for electrical power in any building. It receives power from the utility company and contains the main breaker and branch circuit breakers that control individual circuits throughout the structure. This is critical infrastructure for LADWP service delivery."},{"id":8,"question":"How many conductors are required in a three-phase, four-wire system?","options":{"A":"Two","B":"Three","C":"Four","D":"Five","E":"Six"},"answer":"C","answer_text":"Four","rationale":"A three-phase, four-wire system consists of three phase conductors carrying the three phases of alternating current plus a neutral conductor that completes the circuit and carries unbalanced current. The fourth wire is the neutral, making four total current-carrying conductors in this configuration."},{"id":9,"question":"What is the correct wire size for a 20-amp branch circuit under normal conditions?","options":{"A":"14 AWG Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"12 AWG","C":"10 AWG","D":"8 AWG","E":"6 AWG"},"answer":"B","answer_text":"12 AWG","rationale":"According to NEC 210.3, a 20-amp circuit must be wired with 12 AWG or larger copper conductor. Using 14 AWG with a 20-amp breaker violates code and creates a fire hazard because the wire cannot safely handle 20 amps. Oversizing to 10 AWG or larger is unnecessary and wasteful for a 20-amp circuit."},{"id":10,"question":"What does PVC stand for in electrical installations?","options":{"A":"Plastic Vinyl Conduit","B":"Polyvinyl Chloride","C":"Pressure Valve Control","D":"Power Voltage Conductor","E":"Protective Vinyl Cable"},"answer":"B","answer_text":"Polyvinyl Chloride","rationale":"PVC (Polyvinyl Chloride) is a thermoplastic material commonly used for electrical conduit, cable trays, and raceways. It provides protection for conductors, is corrosion-resistant, and is easy to install. LADWP installations frequently use PVC conduit for both underground and above-ground applications."},{"id":11,"question":"Which of the following is NOT a type of electrical fault?","options":{"A":"Phase-to-phase short circuit Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"Phase-to-ground short circuit","C":"Three-phase balance","D":"Line-to-ground fault","E":"Three-phase short circuit"},"answer":"C","answer_text":"Three-phase balance","rationale":"A three-phase balance is a normal, desired operating condition where all three phases are equally loaded. It is not a fault. All other options describe abnormal fault conditions that create dangerous overcurrents and must be detected and isolated quickly by protective devices."},{"id":12,"question":"What is the minimum clearance that must be maintained around electrical equipment for safe operation and maintenance?","options":{"A":"6 inches","B":"12 inches","C":"3 feet","D":"1 foot","E":"It depends on voltage only"},"answer":"C","answer_text":"3 feet","rationale":"NEC 110.26 requires a minimum clearance of 3 feet (or as specified by equipment manufacturer, whichever is greater) in front of electrical equipment to allow safe access and maintenance. This space is necessary to prevent accidents and to allow technicians to work safely around energized equipment."},{"id":13,"question":"What is the primary function of a transformer? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"To store electrical energy","B":"To convert voltage and current levels while maintaining power transfer","C":"To generate electricity","D":"To measure electrical current","E":"To disconnect circuits"},"answer":"B","answer_text":"To convert voltage and current levels while maintaining power transfer","rationale":"Transformers use electromagnetic induction to step voltage up or down in AC circuits. In a step-up transformer, voltage increases while current decreases; in a step-down transformer, voltage decreases while current increases. This allows LADWP to efÏciently transmit power over long distances at high voltage, then step it down for use."},{"id":14,"question":"What does GFCI stand for?","options":{"A":"Ground Fault Circuit Interrupter","B":"General Fault Control Interface","C":"Ground Frequency Circuit Indicator","D":"General Flux Current Interlock","E":"Grounded Facility Cycle Interrupt"},"answer":"A","answer_text":"Ground Fault Circuit Interrupter","rationale":"A GFCI is a protective device that monitors the difference between incoming and outgoing current. If it detects a ground fault (current leaking to ground), it trips within milliseconds, protecting people from electrocution. GFCIs are required in wet locations like bathrooms, kitchens, and outdoor areas per NEC 210.8. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":15,"question":"What is the purpose of electrical bonding?","options":{"A":"To increase resistance in a circuit","B":"To ensure low-resistance connections between conductive parts to prevent potential differences","C":"To insulate metal parts from each other","D":"To increase the voltage in a system","E":"To reduce power consumption"},"answer":"B","answer_text":"To ensure low-resistance connections between conductive parts to prevent potential differences","rationale":"Bonding creates low-resistance paths between conductive parts (equipment frames, conduit, etc.) to minimize voltage gradients and ensure all parts are at the same potential. This prevents shock hazards and ensures proper operation of ground fault protection devices during fault conditions."},{"id":16,"question":"Which type of wire insulation is most commonly used in residential wiring?","options":{"A":"Rubber","B":"Lead","C":"Polyvinyl Chloride (PVC)","D":"Paper","E":"Cloth"},"answer":"C","answer_text":"Polyvinyl Chloride (PVC)","rationale":"PVC is the standard insulation material for residential and commercial wiring because it is flame-retardant, moisture-resistant, affordable, and durable. It provides excellent protection against mechanical damage and environmental Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) exposure, making it ideal for LADWP service areas with varying environmental conditions."},{"id":17,"question":"What is the correct procedure when working on energized electrical equipment?","options":{"A":"Work without precautions if you are experienced","B":"De-energize whenever possible; if energized work is justified and permitted, follow required electrical safe-work practices, including appropriate shock/arc-flash protection and PPE","C":"Only work on live equipment during business hours","D":"Always use bare hands for better sensitivity","E":"Energized electrical work is never permitted"},"answer":"B","answer_text":"De-energize whenever possible; if energized work is justified and permitted, follow required electrical safe-work practices, including appropriate shock/arc-flash protection and PPE","rationale":"Electrical work should normally be performed de-energized. When energized work is justified and permitted, qualified persons must follow applicable electrical safe-work practices and use the required protective equipment. Lockout/tagout is used to establish and maintain a de-energized condition; it is not a substitute for energized-work procedures."},{"id":18,"question":"What does AFCI stand for?","options":{"A":"Arc Fault Circuit Interrupter","B":"Automatic Frequency Control Interface","C":"Adapter For Current Input","D":"Adjustable Fault Circuit Item","E":"Arc-Free Conduction Indicator Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"A","answer_text":"Arc Fault Circuit Interrupter","rationale":"An AFCI detects dangerous arcing conditions that occur when conductors are damaged or loose. These arcs can cause fires. AFCIs are now required by NEC in most 120-volt circuits in homes and buildings to provide fire protection. LADWP emphasizes AFCI installation in new and renovated facilities."},{"id":19,"question":"What is the maximum allowable voltage drop in a branch circuit?","options":{"A":"1%","B":"3%","C":"5%","D":"10%","E":"15%"},"answer":"B","answer_text":"3%","rationale":"For NEC design guidance, voltage drop is recommended not to exceed 3% on a branch circuit and 5% for the combined feeder and branch circuit. The NEC voltage-drop provisions are generally recommendations rather than a blanket maximum for every branch circuit."},{"id":20,"question":"Which of the following best describes the difference between AC and DC current?","options":{"A":"AC is more dangerous than DC","B":"AC flows continuously in one direction; DC alternates direction","C":"DC flows in one direction; AC alternates direction periodically Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","D":"AC is only used in industrial applications","E":"DC is the only current used in power transmission"},"answer":"C","answer_text":"DC flows in one direction; AC alternates direction periodically","rationale":"Direct Current (DC) flows consistently in one direction from negative to positive terminal, while Alternating Current (AC) reverses direction many times per second (60 Hz in North America). LADWP primarily distributes AC power for efÏciency in transmission and ease of voltage transformation."},{"id":21,"question":"What is the purpose of a disconnect switch?","options":{"A":"To regulate voltage in a circuit","B":"To provide a means to safely isolate electrical equipment from its source of power","C":"To store electrical energy","D":"To measure current flow","E":"To increase circuit efÏciency"},"answer":"B","answer_text":"To provide a means to safely isolate electrical equipment from its source of power","rationale":"Disconnect switches allow technicians to completely isolate equipment from its power source for maintenance or emergency situations. They provide a visible break in the circuit and are essential safety devices. Every piece of electrical equipment served by LADWP must have an accessible disconnect means per NEC."},{"id":22,"question":"What does PPE stand for in electrical safety? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"Power Protection Equipment","B":"Personal Protective Equipment","C":"Preventive Power Electrical","D":"Portable Professional Electrical","E":"Panel Protective Enclosure"},"answer":"B","answer_text":"Personal Protective Equipment","rationale":"PPE includes safety glasses, gloves, hard hats, insulated tools, and other equipment worn to protect workers from electrical, arc flash, and mechanical hazards. LADWP requires appropriate PPE based on hazard analysis for all electrical work to prevent injuries and comply with OSHA regulations."},{"id":23,"question":"What is the standard frequency of alternating current in North America?","options":{"A":"50 Hz","B":"60 Hz","C":"75 Hz","D":"100 Hz","E":"120 Hz"},"answer":"B","answer_text":"60 Hz","rationale":"The standard AC frequency in North America is 60 cycles per second (60 Hz), meaning current completes 60 full cycles of reversal per second. This frequency was standardized early in the development of the power grid. LADWP generates, transmits, and distributes power at this standard frequency."},{"id":24,"question":"What is the purpose of a neutral conductor in a three-phase system? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"To increase voltage in the system","B":"To carry unbalanced current from the three phases and complete the circuit for single-phase loads","C":"To prevent equipment damage","D":"To reduce transmission costs","E":"To measure system voltage"},"answer":"B","answer_text":"To carry unbalanced current from the three phases and complete the circuit for single-phase loads","rationale":"The neutral conductor provides a return path for current and is essential for three-phase, four-wire systems serving mixed loads. In a balanced system, minimal current flows through the neutral; however, when loads are unbalanced, the neutral carries the difference, which is why it must be properly sized and treated as a current-carrying conductor."},{"id":25,"question":"What is the correct way to measure resistance in a circuit?","options":{"A":"With power applied to the circuit using an ammeter","B":"With power applied using a voltmeter","C":"With power removed using an ohmmeter or multimeter set to ohms**","D":"Resistance cannot be measured","E":"By visual inspection only"},"answer":"C","answer_text":"With power removed using an ohmmeter or multimeter set to ohms","rationale":"An ohmmeter applies a small test voltage to measure resistance. Therefore, power must be removed from the circuit before measurement to avoid damage to the ohmmeter and to get accurate readings. Never measure resistance Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) on a live circuit, as this creates serious safety hazards and produces inaccurate results."},{"id":26,"question":"What does \"load\" mean in electrical terms?","options":{"A":"A cargo truck carrying electrical equipment","B":"Any device that consumes electrical power","C":"The weight of electrical wire","D":"A type of electrical cable","E":"The maximum current a wire can carry"},"answer":"B","answer_text":"Any device that consumes electrical power","rationale":"A load is any electrical device or equipment that uses power to perform work, such as lights, motors, heaters, or appliances. Understanding loads is essential for sizing circuits and calculating power requirements. LADWP must size conductors and protective devices based on the total load expected on each circuit."},{"id":27,"question":"What is the primary danger of electrical shock?","options":{"A":"It only causes pain","B":"It damages only the outer layer of skin","C":"It can cause cardiac arrhythmia, respiratory paralysis, or severe burns depending on current magnitude and duration","D":"It is more dangerous in AC than DC circuits","E":"It only affects people with heart conditions"},"answer":"C","answer_text":"It can cause cardiac arrhythmia, respiratory paralysis, or severe burns depending on current magnitude and duration Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Electrical current can have profound effects on the human body. As little as 0.1 amps (100 mA) can cause cardiac ventricular fibrillation; 50 mA can cause respiratory paralysis. Current flow, duration, and pathway through the body determine injury severity. LADWP safety protocols are designed to prevent any human contact with energized parts."},{"id":28,"question":"Which of the following conductor types is rated for installation in wet locations?","options":{"A":"THHN","B":"THWN","C":"TW","D":"THN","E":"T"},"answer":"B","answer_text":"THWN","rationale":"THWN (Thermoplastic, Heat-resistant, Wet and dry locations, Nylon- coated) is rated for wet locations, while THHN is rated for dry locations only. The \"W\" designation indicates wet location suitability. Proper conductor selection is critical for LADWP installations to ensure long-term reliability and safety in variable environmental conditions."},{"id":29,"question":"What is the purpose of equipment grounding?","options":{"A":"To improve electrical efÏciency","B":"To provide a low-resistance path to ground for equipment frames and metal parts to prevent dangerous voltage buildup**","C":"To reduce electricity costs Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","D":"To increase system voltage","E":"To measure current flow"},"answer":"B","answer_text":"To provide a low-resistance path to ground for equipment frames and metal parts to prevent dangerous voltage buildup","rationale":"Equipment grounding ensures that metal frames, enclosures, and other conductive parts are connected to ground. If a phase conductor accidentally contacts a grounded metal frame, the ground path creates a fault current that quickly trips protective devices before anyone can be shocked. This is fundamental to electrical safety."},{"id":30,"question":"What is the correct procedure for replacing a fuse?","options":{"A":"Remove the fuse while the circuit is energized","B":"Use a fuse of a higher amperage rating","C":"De-energize the circuit, remove the old fuse, and replace it with a new fuse of the same type and amperage rating","D":"Never replace fuses","E":"Use any fuse available"},"answer":"C","answer_text":"De-energize the circuit, remove the old fuse, and replace it with a new fuse of the same type and amperage rating","rationale":"Fuses must be replaced with identical replacements. Never upsize a fuse, as this defeats overcurrent protection and creates fire hazards. Always de- energize the circuit before replacement to prevent electrical shock. If a fuse repeatedly blows, investigate the underlying problem rather than just replacing it."},{"id":31,"question":"What is three-phase power primarily used for? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"Residential lighting","B":"Small appliances","C":"Large industrial motors and equipment requiring high power with balanced loading","D":"Battery charging","E":"Emergency lighting systems"},"answer":"C","answer_text":"Large industrial motors and equipment requiring high power with balanced loading","rationale":"Three-phase power provides more efÏcient and economical power delivery for large loads. Three-phase motors run more smoothly and efÏciently than single-phase motors. LADWP provides three-phase power to industrial and large commercial customers, and industrial electricians must understand three- phase systems."},{"id":32,"question":"For a 200-amp dwelling service using copper service conductors, which conductor size is commonly permitted under the dwelling-service conductor rules?","options":{"A":"4 AWG","B":"2 AWG","C":"1 AWG","D":"2/0 AWG","E":"3/0 AWG"},"answer":"D","answer_text":"2/0 AWG","rationale":"Service-conductor sizing depends on the load, conductor material, terminal temperature ratings, and applicable NEC rules. This question is specifically framed around the common 200-amp dwelling-service application; it should not be memorized as a universal conductor size for every 200-amp service."},{"id":33,"question":"What does \"locked out/tagged out\" mean in electrical work?","options":{"A":"A circuit is energized for testing","B":"Equipment is de-energized, locked with a padlock, and tagged to prevent accidental re-energization during maintenance","C":"A worker is not allowed near electrical equipment","D":"Power is partially reduced","E":"Equipment is about to be installed"},"answer":"B","answer_text":"Equipment is de-energized, locked with a padlock, and tagged to prevent accidental re-energization during maintenance","rationale":"Lockout/tagout (LOTO) is an OSHA-mandated safety procedure that physically prevents equipment from being energized during maintenance. A padlock secures the disconnect, and a tag warns of hazards. This protects workers from sudden equipment startup and is essential for safety on all LADWP electrical work."},{"id":34,"question":"What is the proper installation depth for underground residential electrical service?","options":{"A":"At ground level","B":"2 inches deep","C":"12 inches deep","D":"18-24 inches deep depending on conduit type and location Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"As deep as possible"},"answer":"D","answer_text":"18-24 inches deep depending on conduit type and location","rationale":"NEC 300.5 specifies burial depths for underground conductors. Direct buried cable requires 24 inches minimum, while cable in rigid conduit may be 18 inches. Adequate depth protects conductors from mechanical damage, frost heave, and heat. LADWP installation standards meet or exceed these minimums for reliability."},{"id":35,"question":"What is an electrical raceway?","options":{"A":"A competition between electricians","B":"A conduit or channel that holds and protects electrical conductors","C":"A device that regulates voltage","D":"A type of electrical test","E":"A power distribution device"},"answer":"B","answer_text":"A conduit or channel that holds and protects electrical conductors","rationale":"Raceways (such as conduit, cable trays, and channels) enclose and protect electrical conductors from physical damage and environmental exposure. Common types include rigid metal conduit (RMC), electrical metallic tubing (EMT), and PVC. Proper raceway selection and installation is critical for LADWP system longevity and safety."},{"id":36,"question":"What is the purpose of a contactor?","options":{"A":"To measure electrical power Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"To automatically switch electrical circuits on and off based on control signals","C":"To step up voltage in transformers","D":"To store electrical energy","E":"To connect different types of wire"},"answer":"B","answer_text":"To automatically switch electrical circuits on and off based on control signals","rationale":"Contactors are electromagnetic switches that open and close large electrical circuits under the control of lower-power control circuits. They are used in motor starters, HVAC systems, and industrial equipment. Understanding contactor operation is essential for LADWP maintenance and troubleshooting of automated systems."},{"id":37,"question":"What is power factor in AC circuits?","options":{"A":"The ratio of real power to apparent power**","B":"Always equal to 1.0","C":"Not important in electrical systems","D":"The speed at which current flows","E":"The resistance in a circuit"},"answer":"A","answer_text":"The ratio of real power to apparent power","rationale":"Power factor is a measure of how effectively electrical power is being used. A power factor of 1.0 is ideal (resistive loads), but inductive loads (motors, transformers) typically have power factors between 0.7 and 0.9. Poor power factor increases losses and energy costs. LADWP monitors power factor on large industrial accounts."},{"id":38,"question":"Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) What should you do if you discover an electrical hazard on the job site?","options":{"A":"Continue working and ignore it","B":"Tell a coworker but do nothing","C":"Report it immediately to your supervisor and do not use the equipment until it is repaired","D":"Try to fix it yourself","E":"Leave it for someone else to handle later"},"answer":"C","answer_text":"Report it immediately to your supervisor and do not use the equipment until it is repaired","rationale":"Safety is everyone's responsibility. Electrical hazards must be reported immediately and documented. Equipment must be de-energized and locked out until repaired. LADWP emphasizes a safety-first culture where all employees are empowered to stop work if hazards are present and must report issues through proper channels."},{"id":39,"question":"What is the color code for the hot conductor in a single-phase 120/240V residential service?","options":{"A":"White","B":"Green","C":"Black or Red","D":"Yellow","E":"Blue"},"answer":"C","answer_text":"Black or Red","rationale":"In residential service, black and red identify hot (ungrounded) conductors. White identifies neutral, and green (or bare copper) identifies equipment ground. This color coding is universal per NEC Article 310 and is Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) essential for safe circuit identification. LADWP follows strict color-coding standards for all installations."},{"id":40,"question":"Under the NEC countertop-receptacle rule, what is the maximum distance a receptacle may be installed above a countertop or work surface?","options":{"A":"The outlet can be directly above the sink","B":"12 inches","C":"18 inches","D":"20 inches","E":"Outlets should never be installed near sinks"},"answer":"D","answer_text":"20 inches","rationale":"NEC 210.52(C) limits receptacles installed above a countertop or work surface to not more than 20 inches above the surface, subject to the detailed exceptions in the NEC. GFCI requirements near sinks are a separate issue."},{"id":41,"question":"What is the purpose of a surge protector?","options":{"A":"To increase electrical current**","B":"To protect equipment from voltage spikes and transient overvoltages","C":"To reduce electricity usage","D":"To change voltage levels","E":"To prevent overcurrent conditions"},"answer":"B","answer_text":"To protect equipment from voltage spikes and transient overvoltages Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Surge protectors contain devices like metal oxide varistors (MOVs) that divert excess voltage to ground when voltage spikes occur. These spikes can result from lightning, utility switching, or motor loads. Surge protection is essential for protecting sensitive electronic equipment on LADWP systems."},{"id":42,"question":"What does \"amperage\" measure?","options":{"A":"The force pushing electrical current through a circuit","B":"The amount of electrical current flowing through a circuit","C":"The resistance in a circuit","D":"The power consumed by equipment","E":"The voltage available in a circuit"},"answer":"B","answer_text":"The amount of electrical current flowing through a circuit","rationale":"Amperage (measured in amperes or amps) quantifies the amount of electron flow in a circuit. Higher amperage indicates more current flow. Understanding amperage is essential for sizing conductors, selecting protective devices, and safely operating electrical equipment. LADWP limits amperage based on conductor and equipment ratings."},{"id":43,"question":"What is an insulator in electrical terms?","options":{"A":"A tool used by electricians","B":"A material that impedes electrical current flow**","C":"A device that increases current","D":"A type of conductor Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"A protection against mechanical damage"},"answer":"B","answer_text":"A material that impedes electrical current flow","rationale":"Insulators are materials with very high resistance that prevent electrical current flow. Examples include rubber, plastic, ceramic, and glass. Insulation protects conductors and prevents unwanted current flow between conductors or to ground. All LADWP conductors are properly insulated based on voltage and application requirements."},{"id":44,"question":"What is the function of an overcurrent protective device?","options":{"A":"To regulate voltage","B":"To measure power consumption","C":"To automatically disconnect the circuit when current exceeds a safe level","D":"To increase current flow","E":"To store electrical energy"},"answer":"C","answer_text":"To automatically disconnect the circuit when current exceeds a safe level","rationale":"Circuit breakers and fuses are overcurrent protective devices that prevent damage from excessive current. They open the circuit before conductors overheat and cause fires. Proper selection and coordination of protective devices is essential for all LADWP installations to ensure safety and equipment protection."},{"id":45,"question":"What is the maximum spacing for supports on a vertical raceway run under the NEC general raceway-support rule?","options":{"A":"Every 2 feet","B":"Every 3 feet","C":"Every 5 feet","D":"Every 10 feet","E":"Spacing is not important"},"answer":"D","answer_text":"Every 10 feet","rationale":"NEC 300.19 addresses support of conductors in vertical raceways and uses a 10-foot maximum interval in the general case. Other raceway types have their own support rules, so the original question's wording about 'wire clips' was too broad."},{"id":46,"question":"What does UL stand for?","options":{"A":"Utility Limitation","B":"Underwriters Laboratories","C":"Universal Load","D":"Utility Lines","E":"Unit Load"},"answer":"B","answer_text":"Underwriters Laboratories","rationale":"UL is an independent safety testing organization that certifies electrical products and equipment. A UL mark indicates that a device meets recognized safety standards. LADWP specifies UL-listed equipment for all installations to ensure safety and reliability."},{"id":47,"question":"What is the primary purpose of cable sheath or jacket?","options":{"A":"To increase electrical conductivity","B":"To protect conductors from moisture, abrasion, chemicals, and UV exposure Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","C":"To reduce cost","D":"To increase current capacity","E":"To measure voltage"},"answer":"B","answer_text":"To protect conductors from moisture, abrasion, chemicals, and UV exposure","rationale":"Cable jackets provide mechanical and environmental protection for inner conductors. Material selection depends on installation location and application. Underground cable requires oil-resistant jackets, exterior cable requires UV protection, and wet-location cable requires moisture-resistant jackets. Proper cable selection ensures long service life."},{"id":48,"question":"What is a busbar?","options":{"A":"A type of electrical wire","B":"A large conductor or group of conductors used to carry large amounts of current in distribution equipment","C":"A measurement tool","D":"A protective device","E":"A type of electrical switch"},"answer":"B","answer_text":"A large conductor or group of conductors used to carry large amounts of current in distribution equipment","rationale":"Busbars are thick, rigid conductors in service panels and switchboards that distribute power from the main service to branch circuits or to other equipment. They are typically made of copper or aluminum and can carry hundreds or thousands of amperes. LADWP switchboards and distribution panels use appropriately sized busbars. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":49,"question":"What is \"voltage drop\" in a circuit?","options":{"A":"A sudden loss of power","B":"The reduction in voltage that occurs due to resistance in conductors as current flows","C":"An increase in voltage","D":"A temporary power interruption","E":"A grounding problem"},"answer":"B","answer_text":"The reduction in voltage that occurs due to resistance in conductors as current flows","rationale":"As current flows through conductors, resistance causes a voltage reduction from source to load. This voltage drop (VD = I × R) can reduce equipment efÏciency and performance. Proper conductor sizing minimizes voltage drop. NEC specifies maximum allowable voltage drops to ensure safe and efÏcient operation of LADWP systems."},{"id":50,"question":"What should be done before entering a confined electrical space?","options":{"A":"Just go ahead and enter","B":"Have the space tested for hazardous atmospheres, ensure adequate ventilation, provide rescue equipment, and follow confined space entry procedures","C":"Bring a flashlight only","D":"Enter quickly to minimize time exposed","E":"Only one person should enter"},"answer":"B","answer_text":"Have the space tested for hazardous atmospheres, ensure adequate ventilation, provide rescue equipment, and follow confined space entry procedures Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Confined space entry (such as underground vaults) requires OSHA compliance. Atmospheric testing for oxygen levels, combustible gases, and toxic gases is mandatory. Multiple trained personnel, rescue equipment, ventilation, and communication systems are essential. LADWP requires specialized training and procedures for all confined space work."},{"id":51,"question":"What is the purpose of a time-delay fuse?","options":{"A":"To provide instant protection","B":"To allow brief inrush currents during equipment startup while still protecting against sustained overcurrents","C":"To prevent any current flow","D":"To reduce voltage","E":"To measure current"},"answer":"B","answer_text":"To allow brief inrush currents during equipment startup while still protecting against sustained overcurrents","rationale":"Time-delay fuses tolerate temporary current spikes from motor starting without blowing, but will open if sustained overcurrent occurs. These are ideal for motor circuits where inrush current is expected. Fast-acting fuses blow immediately on any overcurrent and are used in circuits without high inrush current."},{"id":52,"question":"What is the meaning of \"open circuit\" in electrical terms?","options":{"A":"A circuit with excessive current","B":"A break in the circuit where no current can flow","C":"A circuit with too much voltage Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","D":"A circuit that is partially energized","E":"A circuit with low resistance"},"answer":"B","answer_text":"A break in the circuit where no current can flow","rationale":"An open circuit occurs when the path for current is broken, such as by an open switch, broken wire, or burned-out component. No current flows in an open circuit. This is different from a short circuit where there is an unintended low- resistance path causing excessive current."},{"id":53,"question":"What is the meaning of \"short circuit\" in electrical terms?","options":{"A":"A circuit using small wires","B":"A circuit with reduced voltage","C":"An unintended low-resistance path that allows excessive current to flow, potentially causing equipment damage or fire","D":"A circuit that is partially open","E":"A temporary power loss"},"answer":"C","answer_text":"An unintended low-resistance path that allows excessive current to flow, potentially causing equipment damage or fire","rationale":"A short circuit occurs when conductors of opposite polarity contact each other or are connected with minimal resistance between them. This causes massive overcurrent that generates heat and can melt conductors and ignite fires if not quickly interrupted by protective devices. LADWP systems are designed to isolate short circuits rapidly."},{"id":54,"question":"If a 100-amp service has 4 AWG copper service-entrance conductors, what copper grounding electrode conductor size is specified by the NEC sizing table?","options":{"A":"14 AWG Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"12 AWG","C":"10 AWG","D":"8 AWG","E":"6 AWG"},"answer":"D","answer_text":"8 AWG","rationale":"Grounding electrode conductor sizing is based on the size of the service-entrance conductors, not simply on the service ampere rating. Under the stated 4 AWG copper assumption, 8 AWG copper is the applicable size under the standard sizing table, subject to the NEC's specific rules and exceptions."},{"id":55,"question":"What is an electrical splice?","options":{"A":"A type of wire","B":"A connection between two or more conductors**","C":"A protective device","D":"A measurement tool","E":"A support device"},"answer":"B","answer_text":"A connection between two or more conductors","rationale":"An electrical splice joins two or more conductors end-to-end. Splices must be mechanically sound, electrically continuous, and properly insulated. They can be made using wire nuts, splice connectors, or terminal blocks. All LADWP splices must be accessible and must comply with NEC 300.15 requirements."},{"id":56,"question":"When adding NM cable to a finished wall where no existing raceway is available, what is the proper general approach?","options":{"A":"Force the cable through any available opening","B":"Create appropriate access/openings and route the cable so it is protected from physical damage and installed according to the cable and building-code requirements","C":"Drill oversized holes anywhere and push the cable through","D":"Leave the cable exposed","E":"It is not possible to add cable in an existing wall"},"answer":"B","answer_text":"Create appropriate access/openings and route the cable so it is protected from physical damage and installed according to the cable and building-code requirements","rationale":"Fish tape is used to pull conductors or cable through an existing raceway or accessible pathway; it does not make an otherwise unsuitable wall cavity into a raceway. NM cable must be installed in accordance with its listing and protected from physical damage."},{"id":57,"question":"What does the abbreviation \"AC\" mean?","options":{"A":"Amperage Capacity","B":"Alternating Current","C":"Automatic Control","D":"Average Current","E":"Applied Conductivity"},"answer":"B","answer_text":"Alternating Current","rationale":"AC (Alternating Current) is electrical current that reverses direction periodically (60 times per second in North America). AC is more efÏcient for long- Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) distance power transmission than DC and is the standard for most electrical distribution systems, including all LADWP service."},{"id":58,"question":"What does the abbreviation \"DC\" mean?","options":{"A":"Direct Current","B":"Disconnected Circuit","C":"Design Capacity","D":"Density Current","E":"Double Conductor"},"answer":"A","answer_text":"Direct Current","rationale":"DC (Direct Current) flows continuously in one direction from negative to positive terminal. While DC is used in some applications (solar systems, emergency lighting with batteries), LADWP primarily provides AC power due to its advantages in generation, transmission, transformation, and use."},{"id":59,"question":"What is the purpose of cable trays?","options":{"A":"To store materials","B":"To support and protect multiple cables in a neat, accessible manner while allowing heat dissipation and easy future modifications","C":"To reduce electrical costs","D":"To measure cable length","E":"To prevent cable movement Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"B","answer_text":"To support and protect multiple cables in a neat, accessible manner while allowing heat dissipation and easy future modifications","rationale":"Cable trays are structural support systems that organize and protect multiple conductors while allowing airflow for cooling. They are commonly used in commercial and industrial LADWP installations where many cables run together. Trays make future modifications easier and provide better organization than individual conduit runs."},{"id":60,"question":"What is the meaning of \"ampere-hours\" (Ah) in battery specifications?","options":{"A":"The voltage rating of a battery","B":"A measure of how much current a battery can supply over a specific time period","C":"The physical size of a battery","D":"The temperature rating of a battery","E":"The weight of a battery"},"answer":"B","answer_text":"A measure of how much current a battery can supply over a specific time period","rationale":"Ampere-hours (Ah) indicates battery capacity. For example, a 50 Ah battery can supply 50 amperes for 1 hour or 1 ampere for 50 hours. This metric is essential for selecting batteries for emergency lighting, UPS systems, and other backup power applications on LADWP systems."},{"id":61,"question":"What is the primary function of a lightning arrestor?","options":{"A":"To stop rain from entering a building Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"To provide a safe path for lightning to ground, preventing damage to electrical systems and structures","C":"To prevent wind damage","D":"To measure storm intensity","E":"To predict lightning strikes"},"answer":"B","answer_text":"To provide a safe path for lightning to ground, preventing damage to electrical systems and structures","rationale":"Lightning arrestors (surge arrestors) divert high-voltage transients from lightning strikes to ground before they can damage equipment. They work similarly to surge protectors but are designed for much higher voltages. LADWP distribution systems use surge arrestors to protect against lightning-induced damage."},{"id":62,"question":"What is the correct installation for a two-way switch?","options":{"A":"Switches are connected in series with the load","B":"Switch wires are connected to the traveler terminals with hot and return wires properly routed and connected","C":"Both switches are connected directly to the load","D":"Switches are connected in parallel","E":"Only one switch is needed for two-way control"},"answer":"B","answer_text":"Switch wires are connected to the traveler terminals with hot and return wires properly routed and connected","rationale":"Two-way (three-way) switches allow control of one light from two locations. The hot wire connects to one switch, traveler wires connect between switches, and the return wire completes the circuit. Proper wire routing ensures safe, code-compliant installation. LADWP installations follow NEC 404 switch installation requirements. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":63,"question":"What is the purpose of a motor starter?","options":{"A":"To rotate a motor manually","B":"To provide overload protection and control circuits for safe motor starting and stopping","C":"To measure motor speed","D":"To lubricate a motor","E":"To increase motor power"},"answer":"B","answer_text":"To provide overload protection and control circuits for safe motor starting and stopping","rationale":"Motor starters are control devices that energize motor coils safely and provide overload protection. They use lower-voltage control circuits to actuate power contactors that switch the full motor voltage. Starters prevent damage from running motors with overloads and provide convenient disconnection for maintenance."},{"id":64,"question":"What is the function of a capacitor in AC circuits?","options":{"A":"To store direct current","B":"To store electrical charge and provide reactive power; appropriately sized capacitors can improve power factor in inductive systems","C":"To increase voltage in every circuit","D":"To measure current","E":"To prevent current flow"},"answer":"B","answer_text":"To store electrical charge and provide reactive power; appropriately sized capacitors can improve power factor in inductive systems","rationale":"Capacitors store energy in an electric field and provide capacitive reactive power in AC systems. Power-factor-correction capacitors can offset inductive reactive power. Capacitors are also used for other purposes, including motor starting and running, but reducing inrush current is not a general function of every capacitor."},{"id":65,"question":"What is \"reactive power\" in AC circuits?","options":{"A":"Power consumed by resistive loads","B":"Power that oscillates between source and load, used by inductors and capacitors but not actually consumed","C":"Power wasted as heat","D":"Power generated by the utility","E":"Power stored in batteries"},"answer":"B","answer_text":"Power that oscillates between source and load, used by inductors and capacitors but not actually consumed","rationale":"Reactive power (VAR - volt-ampere reactive) is generated by inductors and capacitors as current and voltage go in and out of phase. While not \"consumed\" like real power, reactive power increases apparent power and reduces system efÏciency. LADWP uses power factor correction capacitors to reduce reactive power on large industrial circuits."},{"id":66,"question":"What is the purpose of a voltage regulator?","options":{"A":"To prevent current flow Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"To maintain steady voltage output despite variations in load or input voltage","C":"To measure voltage","D":"To disconnect circuits**","E":"To increase conductivity"},"answer":"B","answer_text":"To maintain steady voltage output despite variations in load or input voltage","rationale":"Voltage regulators (tap changers, electronic regulators) maintain constant voltage to equipment by adjusting internal resistances or transformer taps automatically. This prevents voltage swings that can damage equipment or reduce efÏciency. LADWP distribution systems use voltage regulation to serve customers reliably."},{"id":67,"question":"What is a \"megger\" test used for?","options":{"A":"To measure current flow","B":"To measure high-resistance values between conductors and ground, detecting insulation breakdown","C":"To measure voltage in circuits","D":"To measure resistance of connections","E":"To test circuit breakers"},"answer":"B","answer_text":"To measure high-resistance values between conductors and ground, detecting insulation breakdown","rationale":"A megger (high-resistance ohmmeter) applies high test voltage (500V or higher) to measure insulation resistance between conductors and ground. It detects insulation deterioration that could lead to dangerous leakage currents or equipment failure. LADWP uses megger tests for periodic preventive maintenance of motors, transformers, and cables. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":68,"question":"What is the purpose of double-insulated tools?","options":{"A":"To make tools waterproof","B":"To protect operators from electrical shock by providing two layers of insulation even if the outer insulation is damaged","C":"To make tools heavier","D":"To improve conductivity","E":"To reduce tool cost"},"answer":"B","answer_text":"To protect operators from electrical shock by providing two layers of insulation even if the outer insulation is damaged","rationale":"Double-insulated tools have an extra layer of protective insulation around the motor and conductive parts. This provides protection even if the outer insulation is damaged, eliminating the need for grounding. The Class II symbol (two square symbols) identifies double-insulated tools. LADWP encourages use of double-insulated tools for safer work."},{"id":69,"question":"Which statement best describes the service life of electrical equipment?","options":{"A":"Every electrical system lasts exactly 1 year","B":"Every electrical system lasts exactly 5 years","C":"Service life varies widely with equipment type, design, environment, loading, maintenance, and operating conditions","D":"Every electrical system is guaranteed to last 100 years","E":"Service life depends only on how often equipment is used"},"answer":"C","answer_text":"Service life varies widely with equipment type, design, environment, loading, maintenance, and operating conditions","rationale":"There is no universal 20-40 year service-life rule for an electrical system designed to LADWP standards. Different equipment has different expected service lives, and maintenance and operating conditions strongly affect longevity."},{"id":70,"question":"What is the purpose of service entrance seals or conduit seals?","options":{"A":"To prevent water entry into underground conduit systems**","B":"To increase the strength of conduit","C":"To prevent insects from entering","D":"To measure conduit integrity","E":"To connect different conduit sizes"},"answer":"A","answer_text":"To prevent water entry into underground conduit systems","rationale":"Conduit seals are filled with sealant compound to prevent water from traveling through conduit and entering service equipment, which could cause corrosion and electrical hazards. Seals are required at grade level and other low points in conduit runs. LADWP requires seals on all underground conduit installations."},{"id":71,"question":"What is an arc flash and why is it dangerous?","options":{"A":"A small spark that is harmless","B":"Rapid ionization of air that produces intense heat, light, and pressure waves capable of causing severe burns, blindness, and blast injuries**","C":"A type of lightning Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","D":"A harmless electrical phenomenon","E":"An effect that only occurs in AC circuits"},"answer":"B","answer_text":"Rapid ionization of air that produces intense heat, light, and pressure waves capable of causing severe burns, blindness, and blast injuries","rationale":"Arc flash occurs when current jumps across an air gap at high voltage, instantly heating air to plasma temperature (hotter than the sun's surface). This creates burns up to 40+ feet away and can melt skin and clothing. Arc flash studies determine PPE requirements, and LADWP requires arc-rated clothing for working on high-voltage equipment."},{"id":72,"question":"What is the proper way to handle a burned-out transformer?","options":{"A":"Dispose of it in regular trash","B":"Have it professionally serviced or recycled by qualified personnel following environmental regulations for disposal of any oil or hazardous materials","C":"Pour out the oil and discard the shell","D":"Bury it on site","E":"Burn it to destroy it"},"answer":"B","answer_text":"Have it professionally serviced or recycled by qualified personnel following environmental regulations for disposal of any oil or hazardous materials","rationale":"Transformers may contain PCBs (polychlorinated biphenyls) or other hazardous materials requiring special handling. Mineral oil must not enter groundwater. LADWP follows strict environmental regulations for transformer disposal and recycles components when possible. Only certified recyclers should handle transformer waste. Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},{"id":73,"question":"What is the meaning of \"nominal voltage\"?","options":{"A":"The actual voltage measured on a circuit","B":"The named or rated voltage of an electrical system or device, which may differ slightly from actual measured voltage","C":"The minimum voltage allowed","D":"The maximum voltage possible","E":"A voltage that changes constantly"},"answer":"B","answer_text":"The named or rated voltage of an electrical system or device, which may differ slightly from actual measured voltage","rationale":"Nominal voltage is the designated voltage of a system (such as 120V, 240V, 480V). Actual measured voltage may be slightly different due to voltage drop and regulation. LADWP systems are designed around nominal voltages; as long as actual voltage stays within ±10% of nominal, equipment should operate safely."},{"id":74,"question":"What is the function of a disconnect knife switch?","options":{"A":"To regulate voltage","B":"To provide visible disconnection of equipment from its power source and allow for safe lockout/tagout","C":"To measure current","D":"To protect against overload","E":"To filter harmonics"},"answer":"B","answer_text":"To provide visible disconnection of equipment from its power source and allow for safe lockout/tagout Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Knife switches (disconnects) provide visual confirmation that circuits are open and de-energized. The visible blade position clearly shows disconnection status. This is important for safety; workers can see at a glance that equipment is isolated. Knife switches are often used with padlock hasp for lockout/tagout on LADWP equipment."},{"id":75,"question":"What is the purpose of cable bend radius specifications?","options":{"A":"To make installation prettier","B":"To prevent excessive mechanical stress that can damage conductors and insulation**","C":"To allow tighter installations","D":"To increase cable strength","E":"To improve electrical performance"},"answer":"B","answer_text":"To prevent excessive mechanical stress that can damage conductors and insulation","rationale":"Bending cable too tightly can crush internal conductors, damage insulation, and create weak points. Manufacturers specify minimum bend radius (often 8-10 times cable diameter). Proper bend radius maintains cable integrity and ensures long service life. LADWP installation practices comply with all cable bend radius specifications."},{"id":76,"question":"What is a \"watt\" a measure of?","options":{"A":"Current flow","B":"Voltage potential","C":"Electrical power or energy consumption rate Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","D":"Resistance","E":"Capacitance"},"answer":"C","answer_text":"Electrical power or energy consumption rate","rationale":"A watt (W) is the SI unit of power, defined as 1 joule per second. Watts measure the rate at which electrical energy is consumed (P = V × I). Understanding wattage is essential for selecting equipment, sizing circuits, and calculating electrical costs. LADWP bills customers based on energy consumption measured in kilowatt- hours (kWh)."},{"id":77,"question":"What does \"kilowatt-hour\" (kWh) measure?","options":{"A":"The speed of electrical transmission","B":"The amount of electrical energy consumed, calculated as power (kW) times time (hours)**","C":"The instantaneous power","D":"The voltage during an hour","E":"The resistance in a circuit"},"answer":"B","answer_text":"The amount of electrical energy consumed, calculated as power (kW) times time (hours)","rationale":"A kilowatt-hour (kWh) is the amount of energy used by a 1-kilowatt load operating for 1 hour (or 10 kilowatts for 0.1 hours, etc.). LADWP meters measure kWh to bill customers for electricity consumed. Understanding this relationship is important for energy efÏciency and customer billing accuracy."},{"id":78,"question":"What is the proper width for trenching underground conductors?","options":{"A":"As narrow as possible","B":"Wide enough to allow safe installation, access, and compliance with the applicable excavation and soil-stability requirements","C":"1 foot wide regardless of depth","D":"As wide as available space allows","E":"Trench width is unimportant"},"answer":"B","answer_text":"Wide enough to allow safe installation, access, and compliance with the applicable excavation and soil-stability requirements","rationale":"OSHA excavation rules do not establish a universal 30-inch minimum trench width. Safe trench dimensions depend on the work, depth, soil, protective systems, access, and other conditions."},{"id":79,"question":"What is the purpose of using separate equipment ground and neutral conductors in modern electrical systems?","options":{"A":"To confuse electricians","B":"To improve safety by isolating faults and allowing ground faults to be detected through GFCI devices, and to prevent circulating currents on the neutral","C":"To reduce cost","D":"To increase current capacity","E":"To prevent transformer operation"},"answer":"B","answer_text":"To improve safety by isolating faults and allowing ground faults to be detected through GFCI devices, and to prevent circulating currents on the neutral","rationale":"Separating the equipment ground and neutral prevents return current from flowing through ground paths, which could cause dangerous voltage drops on Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com) metal equipment frames. This separation is required at the service entrance per NEC Article 200, except that they must be bonded at the service for system grounding."},{"id":80,"question":"Under the NEC rod-electrode rule, when may a supplemental rod be required because the first rod's measured resistance is not 25 ohms or less?","options":{"A":"At 1 ohm","B":"At 5 ohms","C":"At 25 ohms","D":"At 100 ohms","E":"At 1000 ohms"},"answer":"C","answer_text":"At 25 ohms","rationale":"The 25-ohm value is associated with the NEC exception for a single rod, pipe, or plate electrode. If the resistance of a single rod is not 25 ohms or less, a supplemental electrode is required. This is not a universal maximum resistance for every type of grounding electrode."},{"id":81,"question":"What should be done if an electrical fire breaks out on energized equipment?","options":{"A":"Use water to extinguish it","B":"Use sand or dirt","C":"Use a Class C fire extinguisher and ensure power is de-energized before approaching with water-based extinguishers","D":"Call the fire department and let it burn","E":"Use foam or water spray Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)"},"answer":"C","answer_text":"Use a Class C fire extinguisher and ensure power is de- energized before approaching with water-based extinguishers","rationale":"Class C fire extinguishers use non-conductive agents (CO2, dry powder) safe for electrical fires. Water conducts electricity and creates electrocution hazards. If possible, de-energize the equipment first. If fire cannot be controlled with an extinguisher or power cannot be de-energized, evacuate and call professional fire services. LADWP emphasizes fire safety training."},{"id":82,"question":"What is the purpose of electrical load calculations?","options":{"A":"To determine the height of equipment installation","B":"To determine the total power demand and size conductors, protective devices, and service entrance adequately","C":"To estimate equipment costs","D":"To plan maintenance schedules","E":"To calculate equipment weight"},"answer":"B","answer_text":"To determine the total power demand and size conductors, protective devices, and service entrance adequately","rationale":"Load calculations sum the power requirements of all circuits to determine total electrical demand. This determines service size, feeder conductor sizing, and protective device ratings. Accurate load calculations ensure systems can safely handle peak loads without overheating or voltage drop. NEC Article 220 provides calculation methods LADWP uses for system design."},{"id":83,"question":"What is OSHA and what does it do?","options":{"A":"A tool used in electrical work Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","B":"A federal agency responsible for enforcing workplace safety standards, including electrical safety requirements**","C":"A type of electrical circuit","D":"A utility company","E":"A measurement tool"},"answer":"B","answer_text":"A federal agency responsible for enforcing workplace safety standards, including electrical safety requirements","rationale":"The Occupational Safety and Health Administration (OSHA) sets and enforces standards to protect workers. OSHA regulations cover arc flash protection, lockout/tagout, electrical safety, confined space entry, and other hazards. LADWP must comply with all applicable OSHA standards, and supervisors must ensure compliance through proper training and enforcement."},{"id":84,"question":"What is the primary purpose of equipment grounding?","options":{"A":"To waste electrical energy","B":"To provide a low-impedance fault-current path through exposed conductive equipment parts so protective devices can operate","C":"To reduce power consumption","D":"To increase efficiency","E":"To prevent all voltage spikes"},"answer":"B","answer_text":"To provide a low-impedance fault-current path through exposed conductive equipment parts so protective devices can operate","rationale":"Equipment grounding connects normally non-current-carrying conductive parts to the grounding system so a fault to metal equipment can produce enough fault current to operate the protective device and limit dangerous touch voltage."},{"id":85,"question":"What determines conductor spacing and arrangement in a cable tray?","options":{"A":"No requirements apply","B":"Always one cable diameter","C":"Always one inch","D":"Applicable code requirements, cable ampacity/heat considerations, and the cable-tray and cable manufacturers' requirements","E":"Cables must always touch"},"answer":"D","answer_text":"Applicable code requirements, cable ampacity/heat considerations, and the cable-tray and cable manufacturers' requirements","rationale":"There is no single universal minimum spacing between parallel cables in every cable tray. Installation must follow applicable code requirements, ampacity rules, manufacturer instructions, and the tray's listing."},{"id":86,"question":"What is the definition of \"electrical continuity\"?","options":{"A":"An unbroken path for current flow**","B":"The ability to store energy","C":"The opposition to current flow","D":"The amount of power consumed","E":"The speed of electrical transmission"},"answer":"A","answer_text":"An unbroken path for current flow Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Electrical continuity means an uninterrupted conductive path exists. Splices, connections, and grounds must all maintain continuity for proper circuit operation and safety. Loss of continuity creates open circuits and can cause equipment malfunction or safety hazards. All LADWP splices and connections must verify continuity."},{"id":87,"question":"What is the function of a ground-fault indicator light?","options":{"A":"To illuminate when voltage is present","B":"To indicate when a ground fault or leakage current has been detected","C":"To show that equipment is operating normally","D":"To warn of overload conditions","E":"To measure current flow"},"answer":"B","answer_text":"To indicate when a ground fault or leakage current has been detected","rationale":"Ground fault indicator lights alert operators to dangerous leakage current or insulation breakdown. This warning allows for investigation and repair before complete failure occurs. LADWP monitors ground faults on cable systems through sensitive ground fault indicators that signal the control center when problems develop."},{"id":88,"question":"What is a \"joule\" in electrical terms?","options":{"A":"A unit of voltage","B":"A unit of electrical energy or work, equal to one watt-second**","C":"A type of current","D":"A measurement of resistance Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","E":"A type of conductor"},"answer":"B","answer_text":"A unit of electrical energy or work, equal to one watt- second","rationale":"A joule (J) is the SI unit of energy. One joule is produced by one watt of power operating for one second (1 J = 1 W × 1 s). Understanding joules helps quantify electrical work done by equipment. Heat produced in conductors during power transmission can be calculated in joules."},{"id":89,"question":"What is the proper sequence for working safely on electrical equipment?","options":{"A":"Begin immediately without planning","B":"De-energize and lock out equipment, verify de-energized with test equipment, then perform work with appropriate PPE and tools","C":"Just turn off the main switch","D":"Work as quickly as possible","E":"Wear only a hard hat for protection"},"answer":"B","answer_text":"De-energize and lock out equipment, verify de- energized with test equipment, then perform work with appropriate PPE and tools","rationale":"Safe work procedure includes: (1) de-energize equipment and lock with padlock, (2) verify de-energization with appropriate test equipment (never assume), (3) use insulated tools and PPE, (4) perform work carefully, and (5) only re- energize after verification that work is complete and safe. LADWP requires strict adherence to this procedure for all electrical work."},{"id":90,"question":"What does \"feeder\" mean in electrical systems? Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","options":{"A":"A device that provides food in break rooms","B":"Larger conductors that deliver power from the service entrance to sub-panels or major loads","C":"A type of circuit breaker","D":"A measuring instrument","E":"A type of wire connector"},"answer":"B","answer_text":"Larger conductors that deliver power from the service entrance to sub-panels or major loads","rationale":"Feeders are power-carrying conductors run from the main service to sub-panels, motor control centers, or other major equipment. Feeders are sized for the total connected load and protected by appropriate overcurrent devices. Understanding feeder design is important for commercial and industrial applications that LADWP serves."},{"id":91,"question":"What is the advantage of using aluminum alloy conductors compared to pure copper in some applications?","options":{"A":"Aluminum is more conductive than copper","B":"Aluminum is less expensive and lighter weight, though it has slightly higher resistance and requires larger cross-section for equivalent ampacity","C":"Aluminum never corrodes","D":"Aluminum is easier to terminate","E":"Aluminum cannot be used with copper"},"answer":"B","answer_text":"Aluminum is less expensive and lighter weight, though it has slightly higher resistance and requires larger cross-section for equivalent ampacity Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","rationale":"Aluminum's lower cost and weight make it economical for large transmission and feeder conductors, despite needing larger sizes than copper for equivalent ampacity. Aluminum requires special lugs and connection techniques and is subject to corrosion in damp locations. LADWP uses aluminum for large overhead distribution conductors."},{"id":92,"question":"What is the function of a control transformer in electrical systems?","options":{"A":"To step up voltage for transmission","B":"To supply low voltage for control circuits and signal lights in motor starters and panel controls","C":"To measure voltage","D":"To start large motors","E":"To protect against lightning"},"answer":"B","answer_text":"To supply low voltage for control circuits and signal lights in motor starters and panel controls","rationale":"Control transformers step down line voltage (480V, 240V, etc.) to standard control voltage (120V or 24V) for safe use in control circuits. Lower voltage circuits are less hazardous and allow use of smaller gauge wiring. LADWP industrial installations use control transformers to protect personnel and simplify control circuits."},{"id":93,"question":"What is the purpose of cable pulls or pull boxes in underground installations?","options":{"A":"To decorate the system","B":"To provide access points for installing, removing, and inspecting cables in long runs of conduit Document shared on https://www.docsity.com/en/docs/ladwp-electrical-craft-helper-exam-2026-practice-questions-verified-answers-and-detailed/18837981/ Downloaded by: austin-naumann (thaleygolf@gmail.com)","C":"To store materials","D":"To provide electrical connection points**","E":"To regulate voltage"},"answer":"B","answer_text":"To provide access points for installing, removing, and inspecting cables in long runs of conduit","rationale":"Pull boxes are installed at regular intervals (maximum spacing determined by cable size and conduit diameter) to allow technicians to install cables without excessive pulling tension. They also allow inspection and repair of cables. LADWP underground systems include pull boxes every 200-300 feet or at direction changes."},{"id":94,"question":"What is the correct polarity for connecting a DC device?","options":{"A":"Polarity does not matter for DC devices","B":"Positive lead connects to positive terminal and negative lead to negative terminal; reversed polarity can damage equipment or prevent operation","C":"Either way works the same","D":"Reverse polarity protects equipment","E":"DC devices work regardless of connection direction"},"answer":"B","answer_text":"Positive lead connects to p
